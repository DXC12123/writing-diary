        '</svg></button>'+
    '</header>'+
    '<div class="seg">'+
      '<button class="'+(ui.mode==='day'?'on':'')+'" data-act="mode" data-mode="day">日</button>'+
      '<button class="'+(ui.mode==='month'?'on':'')+'" data-act="mode" data-mode="month">月</button>'+
      '<button class="'+(ui.mode==='year'?'on':'')+'" data-act="mode" data-mode="year">年</button>'+
    '</div>';

  var body = ui.mode === 'day' ? calDay() : (ui.mode === 'month' ? calMonth() : calYear());
  return head + '<div class="body pad">' + body + '</div>';

/* 回顾页：最近写过（最多 3 条） */
function recentList(limit){
  var keys = Object.keys(S.entries).filter(hasContent).sort().reverse().slice(0, limit || 3);
  if(!keys.length) return '';
  var rows = keys.map(function(k){
    var e = S.entries[k], d = parseKey(k);
    var txt = String(e.content || '').replace(/\s+/g, ' ').trim();
    if(txt.length > 34) txt = txt.slice(0, 34) + '…';
    return '<button class="rl-row" data-act="day" data-d="'+k+'">'+
      '<span class="rl-d">'+(d.getMonth()+1)+'/'+d.getDate()+'</span>'+
      '<span class="rl-t">'+esc(txt)+'</span>'+
      '<span class="rl-w">'+wc(e.content)+' 字</span>'+
    '</button>';
  }).join('');
  return '<div class="rl"><p class="rl-hd">最近写过</p>'+rows+'</div>';
}

function calDay(){
  var y = ui.y, m = ui.m;                       // m: 0-11
  var first = new Date(y, m, 1);
  var lead  = (first.getDay() + 6) % 7;          // 周一为 0
  var daysIn = new Date(y, m+1, 0).getDate();
  var t = todayKey();
  var todayDate = parseKey(t);
  var st = monthStat(y, m+1);

  var nY = now().getFullYear(), nM = now().getMonth();
  var atMax = (y > nY) || (y === nY && m >= nM);

  var headCells = WD_ORDER.map(function(i){ return '<div class="wd">'+WD[i]+'</div>'; }).join('');

  var blanks = '';
  for(var i=0;i<lead;i++) blanks += '<div class="day blank"></div>';

  var cells = '';
  for(var d=1; d<=daysIn; d++){
    var k = y+'-'+pad(m+1)+'-'+pad(d);
    var e = getEntry(k);
    var w = e ? wc(e.content) : 0;
    var dbs = dayBooks(k);
    var others = dbs.length - (w > 0 ? 1 : 0);     // 当前这本之外，还有几本在这天写过
    var onlyOther = (w === 0) && dbs.length > 0;
    var future = parseKey(k).getTime() > todayDate.getTime();
    var cls = 'day';
    if(w > 0) cls += ' has';
    if(onlyOther) cls += ' other';
    if(k === t) cls += ' today';
    if(future) cls += ' future';
    var tip = onlyOther
      ? ' title="这天写在「'+esc(dbs[0].name)+'」'+(dbs.length>1?('等 '+dbs.length+' 本'):'')+'里"'
      : (others > 0 ? ' title="这天还有 '+others+' 本也写过"' : '');
    cells += '<button class="'+cls+'" data-act="day" data-d="'+k+'"'+(future?' disabled':'')+tip+'>'+
      '<span class="dn">'+d+'</span>'+
      (w > 0
        ? '<span class="wc"><i class="dot"></i>'+w+'字'+(others > 0 ? '<i class="od"></i>' : '')+'</span>'
        : (onlyOther ? '<span class="wc"><i class="od"></i></span>' : ''))+
    '</button>';
  }

  return ''+
    '<div class="calbar">'+
      '<button class="arrow" data-act="cal-prev" aria-label="上个月">‹</button>'+
      '<b>'+y+'年'+(m+1)+'月</b>'+
      '<button class="arrow" data-act="cal-next" aria-label="下个月"'+(atMax?' disabled':'')+'>›</button>'+
    '</div>'+
    '<div class="cal">'+headCells+blanks+cells+'</div>'+
    '<p class="calsum">'+(st.days ? ('本月已写 '+st.days+' 天'+(st.words? ' · 共 '+st.words+' 字':'')) : '本月还没有记录')+'</p>'+
    (y === nY && m === nM ? pastBlock(t) : '')+
    recentList(3);
}

function calMonth(){
  var y = ui.y;
  var nY = now().getFullYear(), nM = now().getMonth();
  var rows = '';
  for(var i=0;i<12;i++){
    var st = monthStat(y, i+1);
    var cls = 'mrow' + (st.days>0?' wrote':' zero') + (y===nY && i===nM ? ' cur':'');
    rows += '<button class="'+cls+'" data-act="open-month" data-m="'+i+'">'+
      '<b>'+(i+1)+'月</b>'+
      '<span class="md">'+(st.days ? '已写 '+st.days+' 天' : '没有记录')+'</span>'+
      '<span class="mw">'+(st.words ? st.words+' 字' : '')+'</span>'+
    '</button>';
  }
  var ys = yearStat(y);
  return ''+
    '<div class="calbar">'+
      '<button class="arrow" data-act="year-prev" aria-label="上一年">‹</button>'+
      '<b>'+y+' 年</b>'+
      '<button class="arrow" data-act="year-next" aria-label="下一年">›</button>'+
    '</div>'+
    '<div class="mlist">'+rows+'</div>'+
    '<p class="calsum">本年已写 '+ys.days+' 天'+(ys.words? ' · 共 '+ys.words+' 字':'')+'</p>';
}

function calYear(){
  var years = allYears();
  var rows = years.map(function(y){
    var st = yearStat(y);
    return '<button class="yrow" data-act="open-year" data-y="'+y+'">'+
      '<b>'+y+' 年</b><span>已写 '+st.days+' 天'+(st.words?' · '+st.words+' 字':'')+'</span></button>';
  }).join('');
  return '<div class="ylist">'+rows+'</div>'+
    '<p class="calsum">共 '+years.length+' 年有记录</p>';
}

/* =========================================================
   7. 浮层：sheet / 详情页
   ========================================================= */
function openSheet(html){
  layerToken++;
  layer.className = 'overlay';
  layer.hidden = false;
  layer.innerHTML = '<div class="scrim" data-act="close"></div><div class="sheet">'+html+'</div>';
  requestAnimationFrame(function(){ layer.classList.add('show'); });
}
function openPage(html){
  layerToken++;
  layer.className = 'overlay page';
  layer.hidden = false;
  layer.innerHTML = '<div class="page-sheet">'+html+'</div>';
  requestAnimationFrame(function(){ layer.classList.add('show'); });
}
function closeLayer(){
  var my = ++layerToken;
  layer.classList.remove('show');
  setTimeout(function(){
    if(my !== layerToken) return;      // 期间已打开新浮层，不要清空它
    layer.hidden = true;
    layer.innerHTML = '';
    if(shareBack){                     // 从详情页进来的分享浮层：关掉后回到那一篇
      var bk = shareBack; shareBack = null;
      openDetail(bk);
    }else{
      viewBookId = null;               // 详情页关掉了，下次从回顾打开仍看当前本
    }
  }, 210);
}

/* ---- 问题编辑 ---- */
function openQEdit(i){
  var cur = S.questions[i] || '';
  openSheet(
    '<div class="sheet-hd"><b>'+(cur?'编辑问题':'添加问题')+'</b><span class="cnt">第 '+(i+1)+' 格</span></div>'+
    '<textarea class="sheet-ta" id="qta" maxlength="50" placeholder="写下你的问题，例如：今天有什么让我在意的小事？">'+esc(cur)+'</textarea>'+
    '<div class="row-between">'+
      '<span class="muted" id="qcnt">'+Array.from(cur).length+'/50</span>'+
      '<div class="row-end">'+
        (cur ? '<button class="btn danger-ghost" data-act="del-q" data-i="'+i+'">删除</button>' : '')+
        '<button class="btn primary" data-act="save-q" data-i="'+i+'">保存</button>'+
      '</div>'+
    '</div>'
  );
  var ta = $('#qta');
  if(ta){
    ta.focus();
    try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(e){}
    ta.addEventListener('input', function(){
      var c = $('#qcnt'); if(c) c.textContent = Array.from(ta.value).length + '/50';
    });
  }
}
function saveQ(i){
  var ta = $('#qta');
  if(!ta) return;
  var v = ta.value.replace(/\s+/g,' ').trim().slice(0,50);
  if(!v){ S.questions[i] = ''; }         // 空问题不保存
  else { S.questions[i] = v; }
  persist();
  closeLayer();
  render();
  toast(v ? '问题已保存' : '空问题已清除');
}
function delQ(i){
  S.questions[i] = '';
  persist();
  closeLayer();
  render();
  toast('已删除');
}
function seedQ(){
  S.questions = SAMPLE_Q.slice(0,9);
  persist();
  closeLayer();
  render();
  toast('已填入示例问题，可逐格修改');
}

/* ---- 随机问题：从内置问题库抽 9 条 ---- */
function randomQuestions(silent){
  if(!RANDOM_Q.length){ toast('问题库是空的'); return false; }
  var pool = RANDOM_Q.slice(), pick = [], n = Math.min(9, pool.length);
  while(pick.length < n){
    var i = Math.floor(Math.random()*pool.length);
    pick.push(pool.splice(i,1)[0]);
  }
  while(pick.length < 9) pick.push('');
  S.questions = pick;
  persist();
  render();
  if(!silent) toast('已换一组问题');
  return true;
}

/* ---- 写作时看问题（只读） ---- */
function questionsROBody(){
  var filled = S.questions.filter(Boolean).length;
  var rows = S.questions.map(function(t,i){
    return '<li'+(t?'':' class="empty"')+'>'+
      '<span class="pl-n">'+(i+1)+'</span>'+
      '<span class="pl-t">'+(t?esc(t):'未设置')+'</span>'+

  return '<div class="sheet-hd"><b>写作提示</b><span class="cnt">'+filled+' / 9</span></div>'+
    '<ul class="plist">'+rows+'</ul>'+
    '<p class="muted" style="margin:14px 2px 0">换一组只改问题，不会动到已写的内容</p>'+
    '<div class="row-between" style="margin-top:10px">'+
      '<button class="btn ghost" data-act="close">收起</button>'+
      '<button class="btn primary" data-act="random-q">随机问题</button>'+

function openQuestionsRO(){

}
/* 换题后原地刷新浮层，避免重新播放上滑动画 */
function refreshQuestionsRO(){

  if(!sh){ return; }

/* ---- 提交确认 ---- */
function openSubmit(){
  var e = getEntry(todayKey());
  if(!e || !wc(e.content)){ toast('先写点内容再提交吧'); return; }
  openSheet(
    '<div class="sheet-hd"><b>提交后不可修改</b></div>'+
    '<p class="sheet-p">今天这篇日记（'+wc(e.content)+' 字）将被锁定为只读，之后不能再编辑，也无法撤销。确定提交吗？</p>'+
    '<div class="row-end">'+
      '<button class="btn ghost" data-act="close">再想想</button>'+
      '<button class="btn primary" data-act="lock">确定锁定</button>'+
    '</div>'
  );
}
function doLock(){
  var k = todayKey();
  var e = getEntry(k);
  if(!e){ closeLayer(); return; }
  e.status = 'locked';
  e.wordCount = wc(e.content);
  e.updatedAt = new Date().toISOString();
  e.lockedAt = e.updatedAt;
  persist();
  closeLayer();
  render();
  toast('已提交锁定');
}

/* ---- 只读详情 ---- */
/* 往年的今天：同月同日、有内容、其余年份（b 省略时按当前本） */
function sameDayPast(k, b){
  var es = (b && b.entries) ? b.entries : S.entries;
  var mmdd = k.slice(4), out = [];
  Object.keys(es).forEach(function(x){
    var e = es[x];
    if(x.length === 10 && x.slice(4) === mmdd && x !== k && e && wc(e.content)) out.push(x);
  });
  return out.sort().reverse();     /* 年份新的在前 */
}
function snippet(k, b){
  var es = (b && b.entries) ? b.entries : S.entries;
  var e = es[k];
  var t = String((e && e.content) || '').replace(/\s+/g, ' ').trim();
  if(t.length > 22) t = t.slice(0, 22) + '…';
  return t || '（没有内容）';
}
function pastRows(ks, b){
  return ks.map(function(x){
    return '<button class="rl-row" data-act="detail" data-d="'+x+'">'+
      '<span class="rl-d">'+x.slice(0,4)+'</span>'+
      '<span class="rl-t">'+esc(snippet(x, b))+'</span>'+
      '<span class="rl-w">'+wc(((b && b.entries) ? b.entries : S.entries)[x].content)+' 字</span>'+
    '</button>';
  }).join('');
}
function pastBlock(k, b){
  var ks = sameDayPast(k, b);
  if(!ks.length) return '';
  return '<div class="rl past"><p class="rl-hd">往年的今天</p>'+pastRows(ks, b)+'</div>';
}
/* 详情页的上一篇 / 下一篇：只在有内容的日期之间走（b 省略时按当前本） */
function neighbors(k, b){
  var es = (b && b.entries) ? b.entries : S.entries;
  var ks = Object.keys(es).filter(function(x){
    var e = es[x];
    return !!(e && wc(e.content));
  }).sort();
  var i = ks.indexOf(k);
  if(i < 0) return { prev:null, next:null };
  return { prev: i > 0 ? ks[i-1] : null, next: i < ks.length-1 ? ks[i+1] : null };
}
function entryNav(k, b){
  var nb = neighbors(k, b);
  if(!nb.prev && !nb.next) return '';
  var prev = nb.prev
    ? '<button class="tnav prev" data-act="detail" data-d="'+nb.prev+'">'+
        '<span class="tn-k">上一篇 · '+esc(shortDate(nb.prev))+'</span>'+
        '<span class="tn-t">'+esc(snippet(nb.prev, b))+'</span></button>'
    : '';
  var next = nb.next
    ? '<button class="tnav next" data-act="detail" data-d="'+nb.next+'">'+
        '<span class="tn-k">下一篇 · '+esc(shortDate(nb.next))+'</span>'+
        '<span class="tn-t">'+esc(snippet(nb.next, b))+'</span></button>'
    : '';
  return '<div class="tnav-row">'+prev+next+'</div>';
}
/* bid = 要看哪一本（省略就用当前正在看的那本）；换本只改 viewBookId，不动 activeId */
function openDetail(k, bid){
  if(bid) viewBookId = bid;
  if(!viewBookId) viewBookId = S.activeId;
  var vb = viewBook();
  if(!bookById(vb.id)){ viewBookId = S.activeId; vb = curBook(); }
  var e = (vb.entries || {})[k];
  if(!e || typeof e !== 'object') return;
  if(!e.status) e.status = 'draft';
  var locked = e.status === 'locked';
  var dbs = dayBooks(k);
  /* 这一天写在两本以上：页头下面直接列出这几本，点一下就地换，不跳页 */
  var bar = dbs.length > 1 ? '<div class="dbooks">'+dbs.map(function(b){
    var be = bookEntryAt(b, k), on = (b.id === vb.id);
    return '<button class="dbk'+(on?' on':'')+'" data-act="pick-book" data-id="'+b.id+'" data-d="'+k+'">'+
      esc(b.name)+'<i>'+(be ? wc(be.content) : 0)+'字</i></button>';
  }).join('')+'</div>' : '';
  /* 正在看的不是当前本：一行小字说清楚「回顾页不会跟着变」 */
  var hint = vb.id !== S.activeId
    ? '<p class="viewhint">正在看「'+esc(vb.name)+'」 · 回顾页仍按「'+esc(curBook().name)+'」算，返回后不变</p>'
    : '';
  openPage(
    '<div class="hd back">'+
      '<button class="backbtn" data-act="close">‹ 返回</button>'+
      '<span class="hd-book" title="'+esc(vb.name)+'">'+esc(vb.name)+'</span>'+
      '<span class="hd-spacer"></span>'+
      '<button class="sharebtn" data-act="share-now" data-k="'+k+'" aria-label="分享这一篇" title="分享">'+
        '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+
        '<path d="M12 15V3"/><path d="M8.2 6.8 12 3l3.8 3.8"/>'+
        '<path d="M5 13v6.2A1.8 1.8 0 0 0 6.8 21h10.4A1.8 1.8 0 0 0 19 19.2V13"/>'+
        '</svg></button>'+
      '<span class="hd-s">'+(locked ? '已锁定 · 只读' : '草稿 · 只读')+'</span>'+
    '</div>'+
    bar+
    hint+
    '<article class="entry">'+
      '<h2>'+esc(fmtCN(k))+'</h2>'+
      '<p class="meta">'+wc(e.content)+' 字'+(locked && e.lockedAt ? ' · 提交于 '+fullTime(e.lockedAt) : '')+'</p>'+
      '<div class="content">'+(wc(e.content) ? esc(e.content) : '<span class="muted">（没有内容）</span>')+'</div>'+
      pastBlock(k, vb)+
      entryNav(k, vb)+
      '<div class="share-entry">'+
        '<button class="btn ghost" data-act="copy-text" data-k="'+k+'">复制正文</button>'+
        '<button class="btn ghost" data-act="share-open" data-k="'+k+'">存成一页纸</button>'+
      '</div>'+
    '</article>'
  );
}

function shareWrap(ctx, text, maxW){
  var out = [], paras = String(text||'').split('\n');
  paras.forEach(function(p){
    if(!p){ out.push(''); return; }
    var line = '';
    for(var i=0;i<p.length;i++){
      var ch = p.charAt(i);
      /* emoji 是代理对，拆开就成了两个乱码方块——成对处理 */
      var code = p.charCodeAt(i);
      if(code >= 0xD800 && code <= 0xDBFF && i+1 < p.length){
        ch += p.charAt(i+1); i++;
      }
      if(ctx.measureText(line+ch).width > maxW && line){ out.push(line); line = ch; }
      else line += ch;
    }
    out.push(line);
  });
  return out;
}

function buildShareCanvas(k, style){
  var e = viewEntry(k);
  if(!e) return null;
  var st = SHARE_THEME[style] || SHARE_THEME.paper;
  var W = 1080, PAD = 88, CW = W - PAD*2, MAXH = 3200;
  var text = String(e.content || '').replace(/\r/g,'');
  var cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  var fs = st.base, LH = 1.95, lines = [], H = 0;
  var head = st.titleSize + 26 + 30 + 40;   /* 标题 + 元信息 + 分隔 */

  for(;;){
    ctx.font = fs + 'px ' + st.family;
    lines = shareWrap(ctx, text, CW);
    H = PAD + head + lines.length*fs*LH + 96 + PAD;
    if(H <= MAXH || fs <= 23) break;
    fs -= 2;
  }
  if(H > MAXH){
    var avail = MAXH - (PAD + head + 96 + PAD);
    var maxLines = Math.max(1, Math.floor(avail / (fs*LH)));
    if(lines.length > maxLines){
      lines = lines.slice(0, maxLines);
      lines[maxLines-1] = lines[maxLines-1].replace(/.$/, '') + '……';
    }
    H = PAD + head + lines.length*fs*LH + 96 + PAD;
  }

  cv.width = W; cv.height = Math.round(H);
  ctx = cv.getContext('2d');
  ctx.textBaseline = 'top';

  if(style === 'custom' && shareBgImg){
    /* 自己的图：等比铺满（cover），再罩一层米白，保证任何照片下正文都读得清 */
    var iw = shareBgImg.width, ih = shareBgImg.height;
    var sc = Math.max(W / iw, cv.height / ih);
    var dw = iw * sc, dh = ih * sc;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, cv.height); ctx.clip();
    ctx.drawImage(shareBgImg, (W - dw) / 2, (cv.height - dh) / 2, dw, dh);
    ctx.restore();
    ctx.fillStyle = st.scrim || 'rgba(247,242,233,.84)';
    ctx.fillRect(0, 0, W, cv.height);
  } else if(st.bg !== st.bg2){
    var g = ctx.createLinearGradient(0, 0, 0, cv.height);
    g.addColorStop(0, st.bg); g.addColorStop(1, st.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, cv.height);
  } else {
    ctx.fillStyle = st.bg;
    ctx.fillRect(0, 0, W, cv.height);
  }

  if(style === 'paper'){
    ctx.save(); ctx.translate(PAD + 6, PAD - 40); ctx.rotate(-0.045);
    ctx.fillStyle = 'rgba(198,178,142,.5)'; ctx.fillRect(0, 0, 300, 52);
    ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(0, 15, 300, 3);
    ctx.fillRect(0, 32, 300, 2);
    ctx.restore();
  } else if(style === 'night'){
    var rg = ctx.createRadialGradient(W*0.78, 120, 10, W*0.78, 120, 540);
    rg.addColorStop(0, 'rgba(190,226,206,.10)'); rg.addColorStop(1, 'rgba(190,226,206,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, 660);
  } else if(style === 'press'){
    ctx.strokeStyle = st.accent; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(PAD, PAD - 42); ctx.lineTo(W - PAD, PAD - 42); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, PAD - 32); ctx.lineTo(W - PAD, PAD - 32); ctx.stroke();
  }

  var y = PAD;
  ctx.fillStyle = st.ink;
  ctx.font = '600 ' + st.titleSize + 'px ' + st.titleFamily;
  ctx.fillText(fmtCN(k), PAD, y);
  y += st.titleSize + 26;

  ctx.fillStyle = st.sub;
  ctx.font = '24px ' + st.family;
  ctx.fillText(wc(text) + ' 字' + (e.status === 'locked' ? ' · 已锁定' : ' · 草稿'), PAD, y);
  y += 30;

  ctx.strokeStyle = st.line; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PAD, y + 6); ctx.lineTo(W - PAD, y + 6); ctx.stroke();
  y += 40;

  ctx.fillStyle = st.ink;
  ctx.font = fs + 'px ' + st.family;
  for(var i=0;i<lines.length;i++){
    ctx.fillText(lines[i], PAD, y);
    y += fs * LH;
  }

  ctx.fillStyle = st.sub;
  ctx.font = '22px ' + st.family;
  ctx.fillText('小鲸鱼 · 写作日记', PAD, cv.height - PAD - 24);
  var dk = k.replace(/-/g, '.');
  ctx.textAlign = 'right';
  ctx.fillText(dk, W - PAD, cv.height - PAD - 24);
  ctx.textAlign = 'left';
  return cv;
}

/* 选图 → 等比缩到 1400px → JPEG .82 → 存到单独的键 */
function onShareBgFile(ev){
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('请选择图片文件'); return; }
  if(f.size > 20*1024*1024){ toast('图片超过 20MB，换一张小一点的'); return; }
  toast('正在处理图片…');
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var MAX = 1400;
      var sc = Math.min(1, MAX / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * sc));
      var h = Math.max(1, Math.round(img.height * sc));
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var cx = cv.getContext('2d');
      cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, h);
      cx.drawImage(img, 0, 0, w, h);
      var data;
      try{ data = cv.toDataURL('image/jpeg', .82); }
      catch(e){ toast('图片处理失败，换一张试试'); return; }
      if(setShareBg(data)){
        shareStyle = 'custom';
        refreshSharePreview();
        toast('背景已设为这张图');
      }
    };
    img.onerror = function(){ toast('图片读取失败，换一张试试'); };
    img.src = fr.result;
  };
  fr.onerror = function(){ toast('图片读取失败，换一张试试'); };
  fr.readAsDataURL(f);
}

function setShareStyle(k){

function saveShare(){
  if(shareKey === null) return;
  /* 背景图还没解码完就保存，会得到一张没有照片的卡片——等一下再存 */
  if(shareStyle === 'custom' && SHAREBG && !shareBgImg){ toast('背景图还在载入，稍等一下再保存'); return; }
  var cv = buildShareCanvas(shareKey, shareStyle);
  if(!cv){ toast('生成失败'); return; }
  var data;
  try{ data = cv.toDataURL('image/png'); }catch(err){ toast('生成失败'); return; }
  var stName = '日系手账';
  SHARE_STYLES.forEach(function(s){ if(s.k === shareStyle) stName = s.n; });
  var name = '小鲸鱼-' + shareKey + '-' + stName + '.png';
  if(window.AndroidHost && typeof window.AndroidHost.saveFileBinary === 'function'){
    try{ window.AndroidHost.saveFileBinary(name, 'image/png', data.split(',')[1]); }
    catch(err){ toast('保存失败'); }
    return;
  }
  if(window.AndroidHost){ toast('请长按图片保存到相册'); return; }
  try{
    var bin = atob(data.split(',')[1]), arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    var blob = new Blob([arr], {type:'image/png'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast('已保存图片');
  }catch(err){ toast('保存失败'); }
}

/* ---- 分享：把这一篇画成图，交给系统分享面板（微信 / QQ / QQ 空间都在列表里） ----
   微信朋友圈没法从外部直达发布页，只能到微信的分享面板；QQ 空间同理，由系统列表里选。 */
function dataUrlToFile(dataUrl, name){
  var bin = atob(dataUrl.split(',')[1]);
  var arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name, {type:'image/png'});
}
function sharePng(k, style){
  var data = '';
  try{
    var cv = buildShareCanvas(k, style);
    if(cv) data = cv.toDataURL('image/png');
  }catch(err){ data = ''; }
  if(!data){ toast('生成图片失败'); return; }
  var name = '小鲸鱼-' + k + '.png';
  /* 安卓外壳：原生分享（会带上 FileProvider 授权） */
  if(window.AndroidHost && typeof window.AndroidHost.shareImage === 'function'){
    try{ window.AndroidHost.shareImage(name, 'image/png', data.split(',')[1]); return; }
    catch(err){}
  }
  /* 网页：Web Share API（安卓 Chrome / iOS Safari 支持分享文件） */
  try{
    var file = dataUrlToFile(data, name);
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({ files:[file], title:'我的日记 · ' + shortDate(k) }).catch(function(){});
      return;
    }
  }catch(err){}
  /* 退路：存成文件，让用户自己发 */
  try{
    var a = document.createElement('a');
    a.href = data; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('这台设备不能直接分享，图片已保存');
  }catch(err){ toast('分享失败'); }
}
/* 详情页「复制正文」：分享到朋友圈 / QQ 时可以直接黏贴，不用长按选字 */
function copyEntry(k){
  var e = viewEntry(k);
  if(!e || !wc(e.content)){ toast('这篇没有内容'); return; }
  var t = String(e.content);
  function ok(){ toast('正文已复制'); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    var done = false;
    try{ ta.select(); ta.setSelectionRange(0, t.length); done = document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta);
    if(done) ok(); else toast('这台设备不允许复制，长按正文也能选');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok, fallback);
  }else fallback();
}

/* 上次备份：只陈述事实，超过 30 天变土黄，不弹窗 */
function backupText(){
  var t = S.settings.exportedAt;
  if(!t) return { txt:'还没导出过备份', warn:true };
  var d = new Date(t);
  if(isNaN(d.getTime())) return { txt:'还没导出过备份', warn:true };
  var days = Math.floor((Date.now() - d.getTime()) / 86400000);
  var s = (d.getMonth()+1)+'月'+d.getDate()+'日';
  var txt;
  if(days <= 0) txt = s+' · 今天';
  else if(days === 1) txt = s+' · 昨天';
  else if(days < 30) txt = s+' · '+days+' 天前';
  else txt = s+' · 已经 '+days+' 天没备份了';
  return { txt:txt, warn: days >= 30 };
}

/* ---- 导出 ---- */
function download(text, filename, mime){
  try{
    /* Android 外壳（WebView）里没有浏览器下载行为：交给原生弹系统「保存到」对话框。
       返回 'android' 表示「已交给原生」，提示由 App 在写完文件后给。 */
    if(window.AndroidHost && typeof window.AndroidHost.saveFile === 'function'){
      window.AndroidHost.saveFile(filename, mime, text);
      return 'android';
    }
    var blob = new Blob([text], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    return true;
  }catch(e){ return false; }
}

/* ---- 导入：兼容 v2（books[]）、v0.7~v0.9 的单本备份，以及直接粘贴的 localStorage 原始对象 ---- */
var pendingImport = null;

function parseBackup(txt){
  var o = JSON.parse(txt);
  if(!o || typeof o !== 'object') return null;

  function readEntries(raw){
    var list = [];
    function push(date, it){
      if(!it || typeof it !== 'object' || typeof date !== 'string') return;
      var c = (it.content == null) ? '' : String(it.content);
      list.push({
        date: date,
        content: c,
        status: it.status === 'locked' ? 'locked' : 'draft',
        createdAt: it.createdAt || null,
        updatedAt: it.updatedAt || null,
        lockedAt: it.lockedAt || null
      });
    }
    if(Array.isArray(raw)){
      raw.forEach(function(it){
        if(!it || typeof it !== 'object') return;
        var d = it.date || it.k || it.key;
        push(typeof d === 'string' ? d.slice(0,10) : '', it);
      });
    }else if(raw && typeof raw === 'object'){
      Object.keys(raw).forEach(function(k){ push(k, raw[k]); });
    }
    return list.filter(function(it){ return /^\d{4}-\d{2}-\d{2}$/.test(it.date) && wc(it.content); })
               .sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function readQs(q){
    var qs = [], anyOrder = false;
    if(Array.isArray(q)){
      q.forEach(function(it){
        if(typeof it === 'string'){ qs.push({ o: qs.length, t: it }); return; }
        if(!it || typeof it !== 'object') return;
        if(it.order != null) anyOrder = true;
        if(typeof it.text === 'string') qs.push({ o: it.order == null ? qs.length : +it.order, t: it.text });
      });
    }
    if(anyOrder) qs.sort(function(a,b){ return a.o - b.o; });
    return qs.map(function(x){ return String(x.t).replace(/\s+/g,' ').trim().slice(0,50); }).filter(Boolean).slice(0,9);
  }

  var books = [];
  if(Array.isArray(o.books) && o.books.length){
    o.books.forEach(function(b){
      if(!b || typeof b !== 'object') return;
      var es = readEntries(b.entries), qs = readQs(b.questions);
      if(!es.length && !qs.length) return;
      books.push({
        name: (typeof b.name === 'string') ? b.name.replace(/\s+/g,' ').trim().slice(0,12) : '',
        createdAt: (typeof b.createdAt === 'string') ? b.createdAt : null,
        questions: qs,
        entries: es
      });
    });
  }else{
    var es0 = readEntries(o.entries), qs0 = readQs(o.questions);
    if(es0.length || qs0.length) books.push({ name:'', createdAt:null, questions:qs0, entries:es0 });
  }
  if(!books.length) return null;
  var days = books.reduce(function(n,b){ return n + b.entries.length; }, 0);
  return { books: books, days: days };
}

function onImportFile(ev){
  var f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!f) return;
  if(f.size > 8 * 1024 * 1024){ toast('文件太大，不太像导出的 JSON 备份'); return; }
  var r = new FileReader();
  r.onload = function(){
    var data = null;
    try{ data = parseBackup(String(r.result)); }catch(err){ data = null; }
    if(!data){ toast('这个文件里没有可导入的日记'); return; }
    pendingImport = data;
    openImportConfirm(f.name);
  };
  r.onerror = function(){ toast('这个文件读不出来'); };
  r.readAsText(f);
}

function mkEntry(it){
  return {
    content: it.content,
    wordCount: wc(it.content),
    status: it.status,
    createdAt: it.createdAt,
    updatedAt: it.updatedAt,
    lockedAt: it.lockedAt
  };
}
function qsToArr(qs){
  var out = (qs || []).slice(0,9);
  while(out.length < 9) out.push('');
  return out;
}

function doImport(mode){
  var d = pendingImport;
  if(!d){ closeLayer(); return; }
  var added = 0, skipped = 0, made = 0;

  if(mode === 'replace'){
    var fresh = d.books.map(function(fb, i){
      var b = makeBook(fb.name || ('第 ' + (i+1) + ' 本'), qsToArr(fb.questions), {}, fb.createdAt);
      fb.entries.forEach(function(it){ b.entries[it.date] = mkEntry(it); added++; });
      return b;
    });
    S.books = fresh;
    S.activeId = fresh[0].id;
    bindActive();
  }else{
    var onlyOne = S.books.length === 1;
    d.books.forEach(function(fb){
      var target = fb.name ? bookByName(fb.name) : (onlyOne ? S.books[0] : null);
      if(!target){
        target = makeBook(fb.name || '导入的一本', qsToArr(fb.questions), {}, fb.createdAt);
        S.books.push(target);
        made++;
      }else{
        var hasQ = (target.questions || []).some(function(t){ return t && t.trim(); });
        if(!hasQ && fb.questions.length) target.questions = qsToArr(fb.questions);
      }
      if(!target.entries || typeof target.entries !== 'object') target.entries = {};
      var es = target.entries;
      fb.entries.forEach(function(it){
        var cur = es[it.date];
        if(cur && wc(cur.content)){ skipped++; return; }
        es[it.date] = mkEntry(it);
        added++;
      });
    });
    bindActive();
  }

  pendingImport = null;
  persist();
  sweepDrafts();
  render();
  closeLayer();
  if(!added && !made) toast('没有可导入的新日记');
  else{
    var tips = [];
    if(added) tips.push('导入 '+added+' 天');
    if(made) tips.push('新建 '+made+' 本');
    if(skipped) tips.push('跳过 '+skipped+' 天已有记录');
    toast('已'+tips.join('，'));
  }
}

/* =========================================================
   8. 交互
   ========================================================= */
document.addEventListener('click', function(ev){
  var tabBtn = ev.target.closest ? ev.target.closest('.tabbar button') : null;
  if(tabBtn){
    ui.tab = tabBtn.dataset.tab;
    if(ui.tab === 'review'){ ui.mode = 'day'; ui.y = now().getFullYear(); ui.m = now().getMonth(); }
    render();
    return;
  }

  var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!t) return;
  var act = t.dataset.act;

  switch(act){
    /* --- 通用 --- */
    case 'close': closeLayer(); break;

    /* --- 我的本子 --- */
    case 'books':          openBooks(); break;
    case 'new-book':       openNewBook(); break;
    case 'create-book':    createBook(); break;
    case 'switch-book':    switchBook(t.dataset.id); break;
    case 'rename-book':    openRenameBook(t.dataset.id); break;
    case 'save-book-name': saveBookName(t.dataset.id); break;
    case 'del-book': openDeleteBook(t.dataset.id); break;
    case 'do-del-book': doDeleteBook(t.dataset.id); break;

    /* --- 问题板 --- */
    case 'edit-q':   openQEdit(+t.dataset.i); break;
    case 'save-q':   saveQ(+t.dataset.i); break;
    case 'del-q':    delQ(+t.dataset.i); break;
    case 'seed':     seedQ(); break;
    case 'random-q': if(randomQuestions(true)){ refreshQuestionsRO(); toast('已换一组问题'); } break;
    case 'random-q-board': randomQuestions(); break;

    /* --- 写日记 --- */
    case 'open-questions': openQuestionsRO(); break;
    case 'open-tips': openTips(); break;
    case 'open-tip':  openTip(+t.dataset.i); break;
    case 'save-draft': {
      var k = todayKey(), e = getEntry(k);
      if(!e || !wc(e.content)){ toast('还没有内容可以保存'); break; }
      e.updatedAt = new Date().toISOString();
      e.wordCount = wc(e.content);
      if(!e.createdAt) e.createdAt = e.updatedAt;
      persist();
      toast('草稿已保存');
      break;
    }
    case 'submit': openSubmit(); break;
    case 'lock':   doLock(); break;
    case 'go-review':
      ui.tab = 'review'; ui.mode = 'day';
      ui.y = now().getFullYear(); ui.m = now().getMonth();
      render();
      break;

    /* --- 回顾 --- */
    case 'mode':
      ui.mode = t.dataset.mode;
      if(ui.mode === 'month' || ui.mode === 'year'){ ui.y = now().getFullYear(); }
      render();
      break;
    case 'cal-prev':
      ui.m--; if(ui.m < 0){ ui.m = 11; ui.y--; }
      render(); break;
    case 'cal-next':
      ui.m++; if(ui.m > 11){ ui.m = 0; ui.y++; }
      render(); break;
    case 'year-prev': ui.y--; render(); break;
    case 'year-next': ui.y++; render(); break;
    case 'open-month':
      ui.m = +t.dataset.m; ui.mode = 'day'; render(); break;
    case 'open-year':
      ui.y = +t.dataset.y; ui.mode = 'month'; render(); break;
    case 'day': {
      var dk = t.dataset.d;
      if(hasContent(dk)){ openDetail(dk, S.activeId); break; }
      var dbl = dayBooks(dk);
      if(dbl.length){                     // 这天写在别的本里：就地翻到那一本，不改当前本
        pickBook(dbl[0].id, dk);
        break;
      }
      if(dk === todayKey()){ ui.tab = 'write'; render(); break; }
      toast('这天没有日记');
      break;
    }
    case 'detail': {
      var rk = t.dataset.d;
      /* 详情页里点上一篇 / 下一篇 / 往年的今天：跟着正在看的那一本走；从回顾列表点进来：看当前本 */
      var inDetail = !layer.hidden && layer.classList.contains('page');
      var rowEntry = inDetail ? viewEntry(rk) : getEntry(rk);
      if(!rowEntry || !wc(rowEntry.content)){ toast('这天没有日记'); break; }
      openDetail(rk, inDetail ? viewBook().id : S.activeId);
      break;
    }
    case 'pick-book': pickBook(t.dataset.id, t.dataset.d); break;

    /* --- 存成一页纸 / 分享 --- */
    case 'share-open': openShare(t.dataset.k); break;
    case 'copy-text':  copyEntry(t.dataset.k); break;
    case 'share-now':  shareEntry(t.dataset.k); break;
    case 'share-sheet': shareFromSheet(); break;
    case 'share-style': setShareStyle(t.dataset.k); break;
    case 'share-bg-pick': pickShareBg(); break;
    case 'share-bg-clear': clearShareBg(); break;
    case 'share-save': saveShare(); break;

    /* --- 设置 --- */
    case 'settings':      openSettings(); break;
    case 'skin': setSkin(t.dataset.k); break;
    case 'set-fs': setFs(t.dataset.v); break;
    case 'set-font': setFont(t.dataset.v); break;
    case 'pick-wallpaper': pickWallpaper(); break;
    case 'clear-wallpaper':
      clearWallpaper();
      refreshSettings();
      toast('壁纸已移除');
      break;
    case 'go-questions':  closeLayer(); ui.tab = 'questions'; render(); break;
    case 'export-txt':    exportText(); break;
    case 'export-json':   exportJSON(); break;
    case 'import-json':   var fi = $('#impfile'); if(fi) fi.click(); break;
    case 'import-merge':   doImport('merge'); break;
    case 'import-replace': doImport('replace'); break;
    case 'about':         openAbout(); break;
  }
});

/* 写作输入框：中文输入法选词期间不许动光标（nudgeCaret 会跳过），选完再补一次 */
document.addEventListener('compositionstart', function(ev){
  var t = ev.target;
  if(t && t.id === 'ta') t.__composing = true;
}, true);
document.addEventListener('compositionend', function(ev){
  var t = ev.target;
  if(t && t.id === 'ta'){ t.__composing = false; nudgeCaret(); }
}, true);
document.addEventListener('focusin', function(ev){
  var t = ev.target;
  if(t && t.id === 'ta') nudgeCaret();
});

/* 输入：自动保存草稿 / 壁纸浓度拖拽 */
document.addEventListener('input', function(ev){
  var ta = ev.target;
  if(ta && ta.dataset && ta.dataset.act === 'wall-range'){
    S.settings.wallv = Math.min(100, Math.max(0, Math.round(+ta.value || 0)));
    applyWall();
    persistSoon();
    var num = document.getElementById('wallv-num');
    if(num) num.textContent = S.settings.wallv + '%';
    return;
  }
  if(!ta || ta.id !== 'ta') return;
  var k = todayKey();
  var e = getEntry(k);
  if(e && e.status === 'locked') return;

  var val = ta.value;
  if(!e){
    if(!val){ return; }
    e = S.entries[k] = {
      date: k, content:'', wordCount:0, status:'draft',
      createdAt: new Date().toISOString(), updatedAt:null, lockedAt:null
    };
  }
  e.content = val;
  e.wordCount = wc(val);
  e.updatedAt = new Date().toISOString();
  if(!e.createdAt) e.createdAt = e.updatedAt;

  if(!val){ delete S.entries[k]; }   // 清空则不保留空草稿

  persistSoon();

  var c = $('#wcount'); if(c) c.textContent = e.wordCount + ' 字';
  var a = $('#autosave'); if(a) a.textContent = '已自动保存 ' + hhmm(e.updatedAt);
  var fh = $('#firsthint'); if(fh) fh.style.display = e.wordCount ? 'none' : '';
});

/* Esc 关闭浮层；本子命名框里按回车 = 点主按钮 */
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Enter' && ev.target && ev.target.id === 'bkname'){
    var sh = ev.target.closest ? ev.target.closest('.sheet') : null;
    var go = sh ? sh.querySelector('.btn.primary') : null;
    if(go){ ev.preventDefault(); go.click(); }
    return;
  }
  if(ev.key === 'Escape' && !layer.hidden) closeLayer();
});

/* =========================================================
   9. 启动
   ========================================================= */
applySkin();
applyFs();
applyFont();
var wpInput = $('#wpfile');
if(wpInput) wpInput.addEventListener('change', onWallpaperFile);
var impInput = $('#impfile');
if(impInput) impInput.addEventListener('change', onImportFile);
var sbInput = $('#sharebgfile');
if(sbInput) sbInput.addEventListener('change', onShareBgFile);
loadShareBg();

var lastDay = todayKey();
if(BOOKS_MIGRATED) persist();   /* 老数据第一次升级：立刻落成 v2，免得每次打开都再迁一次 */
sweepDrafts();
render();


/* 跨天检测：每 30 秒 + 回到前台时 */
setInterval(function(){
  var t = todayKey();
  if(t !== lastDay){
    lastDay = t;
    sweepDrafts();
    render();
  }
}, 30000);

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible'){
    var t = todayKey();
    if(t !== lastDay){ lastDay = t; sweepDrafts(); render(); }
  }
});

})();
</script>
</body>
</html>
