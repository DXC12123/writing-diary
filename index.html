<title>小鲸鱼</title>
<style>
:root{
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Courier New",monospace;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --veil-a:.84;
  --wp-blur:2.5px;
  --wp:none;
  /* 安全区：网页版取 env()，安卓外壳会用 --sat / --sab 覆盖成原生高度 */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  /* 键盘高度：安卓外壳写原生 IME 高度，网页版由 visualViewport 估算；0 表示没开键盘 */
  --kb:0px;
  /* 正文字号倍率：设置里「小 / 中 / 大」只缩放读写正文，不缩 UI */
  --fs:1;
}
html[data-fs="s"]{--fs:.93;}
html[data-fs="l"]{--fs:1.12;}

   data-skin 同时用在设置页的风格小样上。
   ========================================================= */

/* 有壁纸时，页头/页脚的分层遮罩要更透，免得在图片上压出一条纸带 */
html.wall{--veil:rgba(242,236,224,.74);}
html.wall[data-skin="cozy"]{--veil:rgba(22,19,15,.84);}
html.wall[data-skin="focus"]{--veil:rgba(244,246,248,.76);}
html.wall[data-skin="press"]{--veil:rgba(230,218,192,.76);}
html.wall[data-skin="cute"]{--veil:rgba(255,246,249,.78);}
html.wall[data-skin="tech"]{--veil:rgba(5,8,15,.88);}
html.wall[data-skin="whale"]{--veil:rgba(242,250,255,.78);}

/* 有壁纸时，卡片、纸面、输入框都跟着「壁纸浓度」变半透明，照片从底下透出来；
   --wall-card-a 由 applyWall() 按滑块实时写（0 = 最浓不透明，100 = 最清最透） */
html.wall[data-skin="paper"]{--card-wall:rgba(254,251,244,var(--wall-card-a,.62));}
html.wall[data-skin="cozy"]{--card-wall:rgba(34,29,22,var(--wall-card-a,.68));}
html.wall[data-skin="focus"]{--card-wall:rgba(255,255,255,var(--wall-card-a,.58));}
html.wall[data-skin="press"]{--card-wall:rgba(246,240,222,var(--wall-card-a,.64));}
html.wall[data-skin="cute"]{--card-wall:rgba(255,255,255,var(--wall-card-a,.60));}
html.wall[data-skin="tech"]{--card-wall:rgba(11,18,32,var(--wall-card-a,.70));}
html.wall[data-skin="whale"]{--card-wall:rgba(255,255,255,var(--wall-card-a,.56));}
html.wall .q-cell,
html.wall .tipcard,
html.wall .ta,
html.wall .setlist,
html.wall .tlist,
html.wall .skin,
html.wall .bkrow,
html.wall .seg button.on,
html.wall .btn.ghost,
html.wall .day.has,
html.wall .share-pv,
html.wall .page-sheet{
  background:var(--card-wall) !important;
  -webkit-backdrop-filter:blur(9px) saturate(1.05);
  backdrop-filter:blur(9px) saturate(1.05);
}
html.wall .sheet{background:var(--card-wall) !important;}

/* ===== 壁纸层 ===== */
.filehide{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:.01;border:0;padding:0;}
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;display:none;overflow:hidden;}
html.wall .bg{display:block;}
.bg::before{
  content:'';position:absolute;inset:-10px;
  background-image:var(--wp);background-size:cover;background-position:center;background-repeat:no-repeat;
  filter:blur(var(--wp-blur)) saturate(.92);
}
.bg::after{content:'';position:absolute;inset:0;background:var(--paper);opacity:var(--veil-a);}
.view{position:relative;z-index:1;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font:400 15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;}

/* ===== app shell ===== */
.app{
  position:relative;display:flex;flex-direction:column;
  width:100%;max-width:480px;margin:0 auto;
  background:var(--paper);overflow:hidden;
  /* 键盘弹起时整屏让出键盘高度（--kb 由 JS 写），否则输入区会被键盘盖住。
     先写 vh 版兜底：老 WebView 不认 dvh 时也能让出键盘 */
  height:100vh;
  height:calc(100vh - var(--kb,0px));
  height:100dvh;
  height:calc(100dvh - var(--kb,0px));
}
/* 键盘弹起时（html.kb-on）：底部 tab 让位，写作条直接贴住键盘 */
html.kb-on .tabbar{display:none;}
html.kb-on .wfoot{bottom:var(--kb,0px);}
@media(min-width:560px){
  .app{box-shadow:0 0 0 1px rgba(31,29,26,.06),0 40px 80px -40px rgba(31,29,26,.45);}
}
.view{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding-bottom:calc(66px + var(--sab));}
.view.write-view{overflow:hidden;padding-bottom:calc(66px + var(--sab));}

/* ===== header ===== */
.hd{
  display:flex;align-items:flex-start;gap:12px;
  padding:calc(18px + var(--sat)) 18px 12px;
  background:linear-gradient(180deg,var(--veil) 74%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:6;
}
.hd-t{flex:1;min-width:0;}
.hd h1{margin:0;font-size:21px;line-height:1.35;letter-spacing:.5px;font-weight:600;}
.hd h1.date-t{font-size:18.5px;letter-spacing:.3px;}
.hd-s{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.5;}
.hd-s .badge{margin-right:5px;}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;
  background:var(--accent-soft);color:var(--accent-ink);font-weight:600;vertical-align:1px;}
.chip{
  flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;
  box-shadow:0 1px 0 rgba(31,29,26,.03);
}
.chip:active{transform:scale(.97);}
.iconbtn{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);}
.iconbtn:active{transform:scale(.95);}
/* 写作页右上角：新建 + 问题 并排 */
.hd-btns{display:flex;gap:8px;flex:none;align-items:center;}
/* 日期下面那行小字里的本子名：点开「我的本子」 */
.booklink{
  border:0;background:none;padding:2px 0;margin:0;font:inherit;color:var(--ink-2);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);
  cursor:pointer;
}
.booklink:active{color:var(--accent-ink);}

/* ===== body ===== */
.body{flex:1;min-height:0;}
.pad{padding:0 18px 24px;}

/* ===== 九宫格 ===== */
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.q-cell{
  position:relative;aspect-ratio:1/1;border-radius:13px;border:1px solid var(--line);
  background:var(--card);padding:13px 9px 9px;cursor:pointer;text-align:center;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;line-height:1.5;color:var(--ink);letter-spacing:.2px;
  transition:transform .12s,box-shadow .12s;
  overflow:hidden;
}
.q-cell:active{transform:scale(.97);}
.q-cell .idx{position:absolute;left:8px;top:5px;font-size:9.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;letter-spacing:0;}
.q-cell .qt{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.q-cell.empty{border-style:dashed;border-color:var(--line-2);background:transparent;color:var(--sub);font-size:12px;}
.q-cell.empty .plus{font-size:14px;margin-right:2px;}
.hint{font-size:12px;color:var(--sub);line-height:1.7;margin:14px 2px 0;}
.linkbtn{
  border:0;background:none;padding:0;color:var(--accent);font-size:13px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;
}
.emptybox{
  background:transparent;
  border:1px dashed var(--line-2);border-radius:13px;padding:16px 16px 14px;margin-bottom:12px;
}
.emptybox p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2);line-height:1.7;}

/* ===== 写日记 ===== */
.editor{display:flex;flex-direction:column;min-height:0;padding:0 4px;}
.ta{
  flex:1;min-height:0;width:100%;border:0;outline:none;resize:none;background:transparent;
  padding:6px 15px 96px;margin:0;
  font-family:var(--serif);font-size:calc(17px * var(--fs));line-height:2.05;color:var(--ink);
  letter-spacing:.4px;
}
.ta::placeholder{color:var(--plh);}
.ta[readonly]{color:var(--readonly);}
/* 字体：只换字族，字号（--fs）与行高仍按皮肤，全部用手机自带字族、不引外部字体。
   选了一档就整个界面都换（页头、按钮、Tab、日历、设置、正文一起），皮肤自带的等宽/衬线结构让位 */
html[data-font="system"]{--ui-font:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;}
html[data-font="sans"]{--ui-font:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;}
html[data-font="serif"]{--ui-font:"Songti SC","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;}
html[data-font="kai"]{--ui-font:"Kaiti SC","STKaiti","KaiTi","BiauKai",serif;}
html[data-font="mono"]{--ui-font:ui-monospace,"SFMono-Regular",Consolas,"Courier New",monospace;}
html[data-font="round"]{--ui-font:"Yuanti SC","YouYuan","幼圆","Hiragino Maru Gothic ProN","Hiragino Sans GB","MS PGothic","PingFang SC",system-ui,sans-serif;}
html[data-font="thin"]{--ui-font:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;}
html[data-font="bold"]{--ui-font:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;}
html[data-font] body,
html[data-font] body *{font-family:var(--ui-font) !important;}
/* 细黑 / 粗黑：不换字族，只换重量。整屏继承，加粗的强调与按钮单独留一档，别被一起压平 */
html[data-font="thin"] body{font-weight:300;letter-spacing:.01em;}
html[data-font="thin"] body *{font-weight:inherit !important;}
html[data-font="thin"] b,html[data-font="thin"] strong{font-weight:600 !important;}
html[data-font="thin"] .btn,html[data-font="thin"] .seg button.on,
html[data-font="thin"] .tabbar button.on,html[data-font="thin"] .fontpick button.on{font-weight:500 !important;}
html[data-font="bold"] body{font-weight:600;letter-spacing:0;}
html[data-font="bold"] body *{font-weight:inherit !important;}
html[data-font="bold"] b,html[data-font="bold"] strong{font-weight:700 !important;}
html[data-font="bold"] h1,html[data-font="bold"] h2,html[data-font="bold"] .btn,
html[data-font="bold"] .tabbar button.on,html[data-font="bold"] .fontpick button.on{font-weight:700 !important;}
.locked-note{
  margin:0 14px 6px;padding:9px 12px;border-radius:10px;background:var(--rust-soft);
  color:var(--rust-ink);font-size:12.5px;line-height:1.6;
}
.firsthint{
  margin:6px 15px 0;font-size:12.5px;color:var(--sub);line-height:1.85;letter-spacing:.2px;
}
.firsthint .linkbtn{color:var(--accent-ink);font-size:12.5px;font-weight:600;}

/* ===== 存成一页纸（图片分享）===== */
.share-entry{margin:20px 0 2px;display:flex;gap:9px;}
.share-entry .btn{flex:1;}
.share-styles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px;}
.share-styles button{
  padding:9px 4px 8px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);font-family:var(--sans);font-size:11.5px;line-height:1.3;text-align:center;
}
.share-styles button span{display:block;margin-top:3px;font-size:9.5px;color:var(--sub);}
.share-styles button.on{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 1px var(--accent) inset;}
.share-styles button.on span{color:var(--accent-ink);}
/* 第五个风格：自定义背景，独占一行 */
.share-styles button.wide{
  grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 10px;font-size:11.5px;
}
.share-styles button.wide span{display:inline;margin:0;font-size:9.5px;}
.share-bgbar{
  display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;margin:-2px 2px 12px;
  font-size:12px;color:var(--sub);line-height:1.7;
}
.share-bgbar:empty{display:none;}
.share-bgbar .linkbtn{font-size:12px;color:var(--accent-ink);}
.share-pv{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--paper);}
.share-pv img{display:block;width:100%;height:auto;}
.share-note{margin:10px 2px 0;font-size:12px;color:var(--sub);line-height:1.7;}
.share-cta{margin-top:12px;display:flex;gap:9px;}
.share-cta .btn{flex:1;}
.wfoot{
  position:fixed;bottom:calc(66px + var(--sab) + var(--kb,0px));left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:7;
  display:flex;align-items:center;gap:10px;
  padding:10px 16px 12px;
  background:linear-gradient(0deg,var(--veil) 64%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.wstats{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.wcount{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.autosave{font-size:10.5px;color:var(--sub);height:13px;line-height:13px;}
.wbtns{display:flex;gap:8px;flex:none;}
.btn{
  border-radius:10px;font-size:13.5px;padding:9px 15px;border:1px solid transparent;cursor:pointer;
  transition:transform .12s,opacity .12s;white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);color:var(--accent-on);box-shadow:0 2px 8px -4px rgba(58,107,88,.9);}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink);}
.btn.danger-ghost{background:transparent;border-color:var(--danger-line);color:var(--rust);}
.btn.block{width:100%;}
@media(max-width:359px){ .btn{padding:9px 11px;} .chip{padding:6px 11px;font-size:12.5px;} .hd h1.date-t{font-size:17.5px;} }

/* ===== 回顾 ===== */
.seg{display:flex;background:var(--seg);border-radius:10px;padding:3px;margin:0 18px 14px;}
.seg button{
  flex:1;border:0;background:none;font-size:13px;color:var(--ink-2);padding:7px 0;
  border-radius:8px;cursor:pointer;transition:background .15s;
}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(31,29,26,.1);}
.seg.inrow{margin:0;}
/* 正文字体：六档平铺，三列两行 */
.fontpick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px;}
.fontpick button{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  font-size:12.5px;padding:8px 0;border-radius:9px;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.fontpick button.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:600;}
.calbar{display:flex;align-items:center;justify-content:center;gap:14px;padding:2px 0 12px;}
.calbar b{font-size:15px;font-weight:600;letter-spacing:.5px;min-width:118px;text-align:center;}
.arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);}
.arrow[disabled]{opacity:.32;cursor:default;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.wd{text-align:center;font-size:11px;color:var(--ink-3);padding:2px 0 6px;letter-spacing:0;}
.day{
  aspect-ratio:1/1.02;border:0;background:transparent;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;cursor:pointer;padding:0;
  transition:background .12s;
}
.day .dn{line-height:1.1;}
.day .wc{font-size:9.5px;color:var(--sub-2);letter-spacing:-.3px;line-height:1;display:flex;align-items:center;gap:2px;}
.day .dot{width:3px;height:3px;border-radius:50%;background:var(--accent);display:inline-block;}
.day.has{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}
.day.has .wc{color:var(--ok-ink);}
.day.today{box-shadow:inset 0 0 0 1.4px var(--rust);}
.day.future{color:var(--future);cursor:default;}
.day.blank{visibility:hidden;pointer-events:none;}
/* 这天在别的本子里也写过：空心点；当前这本没写、只有别本写过时，格子描一圈淡边，仍然可点 */
.day .od{width:4.5px;height:4.5px;border-radius:50%;border:1.2px solid var(--sub-2);display:inline-block;flex:none;}
.day.has .od{border-color:var(--ok-ink);}
.day.other{box-shadow:inset 0 0 0 1px var(--line-2);}
.day.other .dn{color:var(--ink-2);font-weight:400;}
.calsum{margin:14px 2px 0;font-size:12px;color:var(--ink-2);text-align:center;}

.mlist{display:flex;flex-direction:column;margin-top:2px;}
.mrow{
  display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;
  border:0;border-bottom:1px solid var(--line-soft);background:none;
  padding:13px 2px;cursor:pointer;text-align:left;transition:opacity .12s;
}
.mrow:active{opacity:.55;}
.mrow b{font-size:14px;font-weight:600;letter-spacing:.3px;color:var(--ink);}
.mrow .md{font-size:12px;color:var(--sub);}
.mrow .mw{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;}
.mrow.wrote b{color:var(--accent-ink);}
.mrow.wrote .md{color:var(--ok-ink);}
.mrow.zero .md{color:var(--sub);}
.mrow.cur b::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--rust);margin-right:6px;vertical-align:2px;}

/* 回顾：最近写过 */
.rl{display:block;margin-top:24px;}
.rl.past{margin-top:26px;padding-top:2px;}
.past .rl-row{padding:10px 2px;}
.rl-hd{margin:0 2px 3px;font-size:11px;color:var(--sub);letter-spacing:.7px;}
.rl-row{
  width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:baseline;
  border:0;border-bottom:1px solid var(--line-soft);background:none;padding:11px 2px;
  text-align:left;cursor:pointer;
}
.rl-row:active{opacity:.55;}
.rl-d{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
.rl-t{font-family:var(--serif);font-size:13.5px;color:var(--ink);line-height:1.6;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rl-w{font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums;}

.ylist{display:flex;flex-direction:column;gap:8px;}
.yrow{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;
  cursor:pointer;text-align:left;transition:transform .12s;
}
.yrow:active{transform:scale(.99);}
.yrow b{font-size:15px;font-weight:600;letter-spacing:.3px;}
.yrow span{font-size:11.5px;color:var(--sub);}

/* ===== tabbar ===== */
.tabbar{
  position:fixed;bottom:var(--kb,0px);left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;display:flex;z-index:20;
  background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:var(--sab);
}
.tabbar button{
  flex:1;border:0;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0 9px;font-size:11px;color:var(--sub-2);letter-spacing:.4px;
}
.tabbar button svg{width:21px;height:21px;}
.tabbar .tb-maid{display:none;width:24px;height:24px;align-items:center;justify-content:center;}
.tabbar .tb-maid svg{width:24px;height:24px;image-rendering:pixelated;}
[data-skin="whale"] .tabbar .tb-def{display:none;}
[data-skin="whale"] .tabbar .tb-maid{display:flex;}
.px-mascot{width:72px;height:72px;margin:0 auto 14px;}
.px-mascot svg{width:100%;height:100%;image-rendering:pixelated;}
.tabbar button.on{color:var(--accent);}
.tabbar button.on span{font-weight:600;}

/* ===== overlay / sheet ===== */
/* 浮层也跟着让出键盘高度：输入问题时空键盘别盖住输入框和按钮 */
.overlay{position:fixed;inset:0;bottom:var(--kb,0px);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
.overlay[hidden]{display:none;}
.overlay .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s;}
.overlay.show .scrim{opacity:1;}
.sheet{
  position:relative;width:100%;max-width:480px;background:var(--card);
  border-radius:20px 20px 0 0;padding:18px 18px calc(20px + var(--sab));
  transform:translateY(20px);opacity:0;transition:transform .24s cubic-bezier(.22,.61,.36,1),opacity .24s;
  max-height:calc(88dvh - var(--kb,0px));overflow-y:auto;
  box-shadow:0 -20px 50px -30px rgba(31,29,26,.5);
}
.overlay.show .sheet{transform:none;opacity:1;}
.overlay.page{align-items:stretch;}
.page-sheet{
  position:relative;width:100%;max-width:480px;margin:0 auto;background:var(--paper);
  height:100vh;height:calc(100vh - var(--kb,0px));
  height:100dvh;height:calc(100dvh - var(--kb,0px));
  overflow-y:auto;opacity:0;transform:translateY(10px);
  transition:opacity .2s,transform .24s ease-out;
}
.overlay.show .page-sheet{opacity:1;transform:none;}
.sheet-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;}
.sheet-hd b{font-size:16px;font-weight:600;letter-spacing:.3px;}
.sheet-hd .cnt{font-size:11.5px;color:var(--sub);}
.donebtn{border:0;background:none;color:var(--accent);font-size:14px;font-weight:600;padding:4px 2px;cursor:pointer;}
.sheet-p{margin:0 0 16px;font-size:13.5px;color:var(--ink-2);line-height:1.75;}
.sheet-ta{
  width:100%;min-height:88px;resize:none;outline:none;
  border:1px solid var(--line);border-radius:11px;background:var(--paper);
  padding:12px 13px;font-family:inherit;font-size:15px;line-height:1.7;color:var(--ink);
}
.sheet-ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(58,107,88,.09);}
.sheet-in{
  width:100%;outline:none;border:1px solid var(--line);border-radius:11px;
  background:var(--paper);padding:11px 13px;font-family:inherit;font-size:15px;color:var(--ink);
}
.sheet-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(58,107,88,.09);}
/* 我的本子：一行一本 */
.bklist{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
.bkrow{display:flex;align-items:stretch;background:var(--card);border-bottom:1px solid var(--line-soft);}
.bkrow:last-child{border-bottom:0;}
.bkrow.on{background:var(--accent-soft);}
.bk-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;border:0;background:none;text-align:left;padding:13px 15px;cursor:pointer;color:var(--ink);}
.bk-n{flex:1;min-width:0;font-size:14.5px;font-weight:600;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bk-now{display:inline-block;font-size:10.5px;font-weight:600;margin-left:8px;padding:1px 6px;border-radius:5px;
  background:var(--accent);color:var(--accent-on);vertical-align:2px;}
.bk-today{flex:none;font-size:11.5px;color:var(--sub);}
.bk-op{flex:none;border:0;border-left:1px solid var(--line-soft);background:none;color:var(--accent-ink);
  font-size:12.5px;padding:0 14px;cursor:pointer;}
.bk-op:active{background:var(--paper);}
.bk-op.del{color:var(--rust-ink);padding:0 13px 0 12px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;}
.row-end{display:flex;justify-content:flex-end;gap:9px;}
.muted{color:var(--sub);font-size:12px;}
.grid9.ro .q-cell{aspect-ratio:1/0.84;font-size:11px;cursor:default;padding:12px 8px 8px;}
.grid9.ro .q-cell.empty{color:var(--ink-3);}
.grid9.ro{width:100%;}

/* 问题板空态：3×3 网格改竖排清单，避免大块空洞 */
.grid9.is-empty{display:flex;flex-direction:column;gap:0;}
.grid9.is-empty .q-cell{aspect-ratio:auto;width:100%;min-height:0;border:0;border-bottom:1px solid var(--line-soft);
  background:transparent;border-radius:0;padding:13px 2px;
  flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;}
.grid9.is-empty .q-cell .idx{position:static;left:auto;top:auto;width:14px;text-align:right;
  color:var(--sub-2);font-size:10.5px;line-height:1;}
.grid9.is-empty .q-cell .qt{color:var(--sub);opacity:1;font-size:13.5px;text-align:left;width:auto;}

/* 写作提示浮层：列表 */
.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-soft);}
.plist li{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line-soft);}
.plist .pl-n{flex:none;width:14px;font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;line-height:1.95;text-align:right;}
.plist .pl-t{flex:1;font-size:13.5px;line-height:1.75;color:var(--ink);letter-spacing:.2px;}
.plist li.empty .pl-t{color:var(--sub);font-size:12.5px;}

/* 切页 */
@keyframes viewIn{from{opacity:0}to{opacity:1}}
.view.fade{animation:viewIn .18s ease-out both;}

/* settings */
.setlist{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
.setrow{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card);border:0;border-bottom:1px solid var(--line-soft);
  padding:13px 15px;font-size:14px;cursor:pointer;text-align:left;
}
.setrow:last-child{border-bottom:0;}
.setrow:active{background:var(--paper);}
.setrow .sub{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;font-weight:400;}
.setrow .sub.warn{color:var(--rust-ink);font-weight:500;}
.setrow .chev{color:var(--chev);font-size:15px;}
.setsec{font-size:11.5px;color:var(--sub);margin:16px 0 8px;letter-spacing:.6px;}
.wp-thumb{
  width:46px;height:46px;border-radius:9px;border:1px solid var(--line);flex:none;
  background-size:cover;background-position:center;background-color:var(--seg);
}
.chips{display:flex;gap:6px;flex:none;}
.chips button{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  font-size:11.5px;padding:5px 10px;border-radius:99px;cursor:pointer;
}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:600;}

/* 壁纸浓度拖拽条 */
.setrow.col{display:block;cursor:default;padding:13px 15px 12px;}
.setrow.col .sr-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
.setrow.col .sr-top b{font-weight:500;font-size:14px;}
.rng{
  -webkit-appearance:none;appearance:none;display:block;width:100%;height:20px;margin:0;
  background:transparent;cursor:pointer;
}
.rng:focus{outline:none;}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:var(--seg);}
.rng::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;
  background:var(--card);border:1.5px solid var(--accent);
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.rng::-moz-range-track{height:4px;border-radius:3px;background:var(--seg);}
.rng::-moz-range-thumb{
  width:19px;height:19px;border-radius:50%;background:var(--card);
  border:1.5px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.rng-ends{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--sub);}

/* detail */
.back{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.backbtn{border:0;background:none;color:var(--accent);font-size:14px;padding:4px 0;cursor:pointer;}
/* 详情页顶栏：本名只是说明，切换放在下面那条本子条上 */
.hd-spacer{flex:1;}
.back .hd-book{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;flex:none;color:var(--sub);}
.back .hd-s{margin:0;white-space:nowrap;}
/* 详情页看的是「别的一本」时，一行小字说明：回顾页不会跟着变 */
.viewhint{margin:0 22px 10px;font-size:11.5px;color:var(--sub);line-height:1.6;}
.sharebtn{
  flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink-2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
}
.sharebtn:active{transform:scale(.95);}
/* 详情页的本子条：只列这一天写过的本，点一下就地换正文 */
.dbooks{
  display:flex;gap:8px;overflow-x:auto;padding:0 22px;margin:-2px 0 14px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.dbooks::-webkit-scrollbar{display:none;}
.dbk{
  flex:none;display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line-2);background:transparent;color:var(--sub);font-size:12.5px;
  font-family:inherit;cursor:pointer;line-height:1.2;white-space:nowrap;
}
.dbk i{font-style:normal;font-size:10.5px;opacity:.72;}
.dbk.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.dbk:active{transform:scale(.97);}
.entry{padding:6px 22px 60px;}
.entry h2{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:.4px;line-height:1.5;}
.entry .meta{margin:0 0 20px;font-size:11.5px;color:var(--sub);}
.entry .content{
  font-family:var(--serif);font-size:calc(16.5px * var(--fs));line-height:2.05;letter-spacing:.4px;
  white-space:pre-wrap;word-break:break-word;color:var(--content);
}
.entry .content .muted{font-family:inherit;}

/* 写作小贴士：入口卡 / 目录 / 正文 */
.tipcard{
  width:100%;display:flex;align-items:center;gap:11px;margin:22px 0 0;
  border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px;
  cursor:pointer;text-align:left;transition:transform .12s;
}
.tipcard:active{transform:scale(.99);}
.tipcard .tc-t{display:block;font-size:13.5px;color:var(--ink);letter-spacing:.3px;}
.tipcard .tc-s{display:block;margin-top:3px;font-size:11.5px;color:var(--sub);}
.tipcard .chev{margin-left:auto;color:var(--chev);font-size:15px;}

.tlist{margin-top:2px;}
.tsec{margin:20px 2px 2px;font-size:11px;color:var(--sub);letter-spacing:.7px;}
.trow{
  width:100%;display:flex;align-items:baseline;gap:11px;
  border:0;border-bottom:1px solid var(--line-soft);background:none;
  padding:13px 2px;text-align:left;cursor:pointer;
}
.trow:active{opacity:.55;}
.trow .tn{flex:none;width:17px;font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
.trow .tt{flex:1;font-size:14px;line-height:1.65;color:var(--ink);letter-spacing:.2px;}
.trow .chev{flex:none;color:var(--chev);font-size:14px;}

.tip-body p{
  margin:0 0 1.05em;font-family:var(--serif);font-size:16px;line-height:1.95;
  letter-spacing:.35px;color:var(--content);
}
.tip-try{margin-top:26px;border:1px solid var(--line);border-radius:12px;background:var(--accent-soft);padding:13px 15px;}
.tip-try b{display:block;margin-bottom:5px;font-size:11px;letter-spacing:.8px;color:var(--accent-ink);}
.tip-try span{display:block;font-family:var(--serif);font-size:14.5px;line-height:1.85;color:var(--ink);}

.tnav-row{display:flex;gap:12px;margin-top:30px;padding-top:16px;border-top:1px solid var(--line-soft);}
.tnav{flex:1;min-width:0;border:0;background:none;padding:4px 0;text-align:left;cursor:pointer;}
.tnav:last-child{text-align:right;}
.tnav.prev{margin-right:auto;text-align:left;}
.tnav.next{margin-left:auto;text-align:right;}
.tnav:active{opacity:.55;}
.tnav .tn-k{display:block;margin-bottom:4px;font-size:10.5px;letter-spacing:.6px;color:var(--sub);}
.tnav .tn-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:12.5px;line-height:1.55;color:var(--ink);}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translate(-50%,8px);
  background:var(--toast-bg);color:var(--toast-ink);font-size:13px;padding:9px 17px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;max-width:86vw;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* =========================================================
   风格小样（设置页 · 界面风格选择）
   ========================================================= */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:3px;}
.skin{
  position:relative;display:block;padding:8px 8px 9px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);text-align:left;
  transition:transform .12s,box-shadow .12s,border-color .12s;
}
.skin:active{transform:scale(.985);}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.skin-pv{
  position:relative;
  display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:8px 1fr 6px;gap:4px;
  height:66px;padding:7px;border-radius:10px;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);
}
.skin-pv::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 44%);
}
.skin-pv i{display:block;position:relative;z-index:1;}
.skin-pv .pv-h{grid-column:1/-1;border-radius:2px;background:var(--ink);opacity:.62;}
.skin-pv .pv-c{border-radius:3px;background:var(--card);border:1px solid var(--line);}
.skin-pv .pv-c:nth-of-type(3){background:var(--accent-soft);border-color:transparent;}
.skin-pv .pv-f{grid-column:2/4;justify-self:end;width:24px;border-radius:3px;background:var(--accent);opacity:.92;}

/* 小样也要有各自的脾气 */
.skin-pv[data-skin="paper"]{background:radial-gradient(120% 90% at 6% -10%,#F8F2E7,#F2ECE0 62%);}
.skin-pv[data-skin="paper"]::before{
  content:'';position:absolute;top:5px;left:15px;width:26px;height:7px;border-radius:1px;
  background:rgba(64,84,112,.26);transform:rotate(-3deg);z-index:2;
}
.skin-pv[data-skin="paper"] .pv-c{border-style:dashed;border-color:var(--line-2);}

.skin-pv[data-skin="cozy"]{background:radial-gradient(130% 70% at 50% 120%,#34281A 0%,var(--paper) 64%);}
.skin-pv[data-skin="cozy"] .pv-c{border-color:var(--line-2);box-shadow:0 6px 12px -8px #000;}
.skin-pv[data-skin="cozy"] .pv-f{box-shadow:0 0 10px rgba(232,185,120,.6);}

.skin-pv[data-skin="focus"]{background:linear-gradient(158deg,#E7EDF4 0%,#F3F1EC 100%);}
.skin-pv[data-skin="focus"] .pv-c{background:rgba(255,255,255,.88);box-shadow:0 5px 10px -7px rgba(15,18,22,.45);border-color:rgba(255,255,255,.9);}
.skin-pv[data-skin="focus"] .pv-h{opacity:.82;}
.skin-pv[data-skin="focus"] .pv-f{width:20px;background:var(--ink);}

.skin-pv[data-skin="press"]{
  border-radius:2px;background:var(--paper);
  box-shadow:inset 0 0 0 1px var(--line-2),inset 0 0 0 4px var(--paper);
}
.skin-pv[data-skin="press"]::before{
  content:'';position:absolute;left:5px;right:5px;top:15px;height:3px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
}
.skin-pv[data-skin="press"] .pv-h{background:var(--ink);opacity:.86;}
.skin-pv[data-skin="press"] .pv-c{border-radius:0;background:transparent;border-color:var(--line-2);}
.skin-pv[data-skin="press"] .pv-f{border-radius:0;width:22px;}

.skin-pv[data-skin="cute"]{border-radius:14px;background:linear-gradient(142deg,#FFEFF6 0%,#EFF6FF 56%,#FFF6E0 100%);border-color:#F6DDE6;}
.skin-pv[data-skin="cute"] .pv-c{border-radius:8px;border-color:#F6DDE6;box-shadow:0 5px 10px -7px rgba(214,110,145,.9);}
.skin-pv[data-skin="cute"] .pv-f{border-radius:999px;width:22px;}

.skin-pv[data-skin="tech"]{border-radius:6px;background:radial-gradient(120% 90% at 50% -20%,#0C2138 0%,var(--paper) 72%);border-color:rgba(63,227,232,.25);}
.skin-pv[data-skin="tech"]::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(63,227,232,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(63,227,232,.10) 1px,transparent 1px);
  background-size:10px 10px;
}
.skin-pv[data-skin="tech"] .pv-h{background:var(--accent);opacity:.7;}
.skin-pv[data-skin="tech"] .pv-c{border-radius:2px;background:rgba(11,18,32,.92);border-color:rgba(63,227,232,.35);box-shadow:inset 0 0 8px -4px rgba(63,227,232,.85);}
.skin-pv[data-skin="tech"] .pv-f{border-radius:2px;box-shadow:0 0 8px rgba(63,227,232,.8);}
.skin-pv[data-skin="whale"]{
  border-radius:16px;border:1px solid var(--line-2);
  background:
    radial-gradient(60% 46% at 18% 8%, #FFFFFF 0%, rgba(255,255,255,0) 70%),
    radial-gradient(52% 44% at 88% 84%, #E3F5FE 0%, rgba(227,245,254,0) 70%),
    radial-gradient(circle at 26% 58%, rgba(143,211,244,.5) 0 3px, transparent 4px),
    radial-gradient(circle at 62% 26%, rgba(244,168,190,.42) 0 2.5px, transparent 3.5px),
    radial-gradient(circle at 80% 62%, rgba(178,230,208,.55) 0 2px, transparent 3px),
    var(--paper);
  background-size:100% 100%,100% 100%,52px 52px,44px 44px,38px 38px,100% 100%;
}
.skin-pv[data-skin="whale"] .pv-h{border-radius:999px;background:var(--accent-ink);opacity:.8;}
.skin-pv[data-skin="whale"] .pv-c{border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 12px -9px rgba(31,110,158,.75);}
.skin-pv[data-skin="whale"] .pv-c:nth-of-type(3){background:var(--accent-soft);border-color:transparent;}
.skin-pv[data-skin="whale"] .pv-f{border-radius:999px;width:22px;background:var(--accent);}
.skin-n{display:block;margin-top:8px;font-size:12.5px;font-weight:600;letter-spacing:.2px;color:var(--ink);}
.skin-d{display:block;margin-top:1px;font-size:10.5px;color:var(--sub);}
.skin .tick{
  position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;
  display:none;background:var(--accent);color:var(--accent-on);
  font-size:10px;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--card);
}
.skin[aria-pressed="true"] .tick{display:block;}

/* =========================================================
   各风格的结构性差异（色板之外的部分）
   ========================================================= */

/* ---- 纸 · 和纸手账：生宣、便签格、胶带、朱印 ---- */
[data-skin="paper"] .app{
  background:
    radial-gradient(122% 78% at 8% -12%, #F8F2E7 0%, rgba(248,242,231,0) 58%),
    radial-gradient(96% 66% at 104% 112%, #EDE4D3 0%, rgba(237,228,211,0) 60%),
    var(--paper);
}
[data-skin="paper"] .hd h1{font-size:23px;letter-spacing:1.8px;}
[data-skin="paper"] .q-cell{border-radius:14px;background:#FEFBF4;box-shadow:inset 0 1px 0 rgba(255,255,255,.9);}
[data-skin="paper"] .grid9 .q-cell:nth-child(3n+2){background:#FBF5E7;}
[data-skin="paper"] .grid9 .q-cell:nth-child(3n+3){background:#F1F4EB;}
[data-skin="paper"] .grid9.is-empty .q-cell,
[data-skin="paper"] .grid9 .q-cell.empty{background:transparent;}
[data-skin="paper"] .tipcard{position:relative;overflow:visible;border-radius:13px;background:#FEFBF4;}
[data-skin="paper"] .tipcard::before{
  content:'';position:absolute;left:22px;top:-8px;width:60px;height:15px;border-radius:1px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.30) 0 3px,rgba(255,255,255,0) 3px 9px),
    rgba(64,84,112,.30);
  transform:rotate(-2deg);
  box-shadow:0 1px 3px rgba(90,80,60,.14);
}
[data-skin="paper"] .rl-row,
[data-skin="paper"] .trow,
[data-skin="paper"] .plist li{border-bottom-style:dashed;}
[data-skin="paper"] .setsec,
[data-skin="paper"] .rl-hd{font-size:12px;letter-spacing:1.8px;color:var(--ink-2);}
[data-skin="paper"] .day{border-radius:11px;}
[data-skin="paper"] .day.has{background:#E8EDF3;}
[data-skin="paper"] .entry .content{font-size:calc(15.5px * var(--fs));line-height:1.95;letter-spacing:.2px;}
[data-skin="paper"] .btn.primary{box-shadow:0 8px 20px -12px rgba(47,79,107,.55);}

/* ---- 夜 · 暗黑治愈：底部烛光、柔和圆角 ---- */
[data-skin="cozy"] .app{
  background:
    radial-gradient(135% 58% at 50% 116%, #34281A 0%, rgba(52,40,26,0) 62%),
    radial-gradient(85% 38% at 10% -6%, #23261D 0%, rgba(35,38,29,0) 62%),
    var(--paper);
}
[data-skin="cozy"] .hd h1{font-weight:500;letter-spacing:1.2px;}
[data-skin="cozy"] .q-cell{border-radius:15px;box-shadow:0 14px 28px -22px #000;border-color:var(--line-2);}
[data-skin="cozy"] .day{border-radius:11px;}
[data-skin="cozy"] .entry .content{line-height:1.9;letter-spacing:.15px;}
[data-skin="cozy"] .tabbar{background:rgba(20,17,13,.9);}
[data-skin="cozy"] .btn.primary{box-shadow:0 6px 24px -10px rgba(232,185,120,.55);}

/* ---- 净 · 极简专注：大留白、毛玻璃、细字 ---- */
[data-skin="focus"] .app{
  background:
    radial-gradient(104% 60% at 0% -10%, #DFE8F4 0%, rgba(223,232,244,0) 62%),
    radial-gradient(92% 54% at 100% 0%, #F4EFE7 0%, rgba(244,239,231,0) 60%),
    var(--paper);
}
[data-skin="focus"] .pad{padding:0 20px 26px;}
[data-skin="focus"] .hd{padding-top:calc(22px + var(--sat));}
[data-skin="focus"] .hd h1{font-weight:300;letter-spacing:.3px;font-size:22px;}
[data-skin="focus"] .grid9{gap:11px;}
[data-skin="focus"] .q-cell{
  border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 16px 32px -28px rgba(15,18,22,.8);
  font-size:11.5px;letter-spacing:.3px;
}
[data-skin="focus"] .tipcard,
[data-skin="focus"] .iconbtn,
[data-skin="focus"] .chip,
[data-skin="focus"] .arrow{
  background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
[data-skin="focus"] .tipcard{border-radius:16px;box-shadow:0 12px 30px -26px rgba(15,18,22,.65);}
[data-skin="focus"] .setlist{
  border-radius:16px;background:rgba(255,255,255,.52);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
[data-skin="focus"] .setrow{background:transparent;}
[data-skin="focus"] .setrow:active{background:rgba(255,255,255,.55);}
[data-skin="focus"] .sheet{background:#FBFBFC;}
[data-skin="focus"] .seg{background:rgba(255,255,255,.62);border-radius:12px;}
[data-skin="focus"] .seg button.on{background:#FFF;box-shadow:0 2px 8px -4px rgba(15,18,22,.3);}
[data-skin="focus"] .day.has{background:#E9EDF1;}
[data-skin="focus"] .btn.primary{box-shadow:0 10px 24px -16px rgba(15,18,22,.85);}
[data-skin="focus"] .btn.ghost{background:rgba(255,255,255,.72);backdrop-filter:blur(8px);}
[data-skin="focus"] .tabbar{background:rgba(244,246,248,.74);}

/* ---- 机 · 复古打字机：方角、双线框、等宽字 ---- */
[data-skin="press"] body{letter-spacing:.2px;}
[data-skin="press"] .hd{position:relative;padding-bottom:15px;}
[data-skin="press"] .hd::after{
  content:'';position:absolute;left:18px;right:18px;bottom:0;border-bottom:3px double var(--line-2);
}
[data-skin="press"] .hd h1{font-size:18.5px;letter-spacing:1.4px;}
[data-skin="press"] .hd-s{font-size:11.5px;letter-spacing:.3px;}
[data-skin="press"] .q-cell{border-radius:2px;outline:1px solid var(--line-2);outline-offset:-4px;background:#F6F0DE;}
[data-skin="press"] .q-cell .idx{letter-spacing:.5px;}
[data-skin="press"] .q-cell.empty{outline-style:dotted;background:transparent;}
[data-skin="press"] .setlist{border-radius:2px;outline:1px solid var(--line-2);outline-offset:-3px;}
[data-skin="press"] .tipcard{border-radius:2px;outline:1px solid var(--line-2);outline-offset:-3px;background:#F6F0DE;}
[data-skin="press"] .btn{
  border-radius:2px;letter-spacing:.6px;font-size:12.5px;padding:9px 14px;
}
[data-skin="press"] .tabbar{border-top:3px double var(--line-2);}
[data-skin="press"] .tabbar button{font-size:10.5px;letter-spacing:1px;}
[data-skin="press"] .seg{border-radius:2px;border:1px solid var(--line);}
[data-skin="press"] .seg button{border-radius:0;letter-spacing:1px;}
[data-skin="press"] .entry h2{font-size:17px;letter-spacing:.9px;}
[data-skin="press"] .setsec{letter-spacing:1.4px;}
[data-skin="press"] .chip,[data-skin="press"] .iconbtn{border-radius:2px;}
[data-skin="press"] .day{border-radius:2px;}
[data-skin="press"] .day.has{background:#E4E8D8;}
[data-skin="press"] .sheet{border-radius:8px 8px 0 0;border-top:3px double var(--line-2);}
[data-skin="press"] .ta{font-size:calc(16.5px * var(--fs));line-height:2.15;}
[data-skin="press"] .entry .content{line-height:2;letter-spacing:.2px;}

/* ---- 软 · 超萌可爱：棉花糖、气泡卡 ---- */
[data-skin="cute"] .app{
  background:
    radial-gradient(78% 48% at 10% 3%, #FFE3EE 0%, transparent 60%),
    radial-gradient(70% 44% at 94% 10%, #E3F0FF 0%, transparent 58%),
    radial-gradient(96% 40% at 50% 104%, #FFF3D6 0%, transparent 64%),
    var(--paper);
}
[data-skin="cute"] .hd h1{font-weight:700;letter-spacing:.2px;}
[data-skin="cute"] .hd-s{font-weight:500;}
[data-skin="cute"] .q-cell{
  border-radius:22px;background:#FFFFFF;border-color:#F6DDE6;
  box-shadow:0 12px 22px -18px rgba(214,120,150,.85);
}
[data-skin="cute"] .grid9 .q-cell:nth-child(3n+2){background:#FFF0F7;border-color:#F8D3E2;box-shadow:0 12px 22px -18px rgba(214,110,145,.9);}
[data-skin="cute"] .grid9 .q-cell:nth-child(3n+3){background:#EFF6FF;border-color:#D7E6FA;box-shadow:0 12px 22px -18px rgba(110,150,214,.9);}
[data-skin="cute"] .grid9.is-empty .q-cell,
[data-skin="cute"] .grid9 .q-cell.empty{background:#FFFDFE;}
[data-skin="cute"] .q-cell:active{animation:jelly .46s cubic-bezier(.3,1.3,.5,1);}
[data-skin="cute"] .tipcard{border-radius:22px;border-color:#F6DDE6;box-shadow:0 14px 24px -20px rgba(214,120,150,.85);}
[data-skin="cute"] .tc-t::after{content:' 🐾';font-size:12px;vertical-align:1px;}
/* 莓果色的 accent 当底色够深了，但作为文字仍偏浅时用 accent-ink 保 4.5:1 */
[data-skin="cute"] .linkbtn,
[data-skin="cute"] .donebtn,
[data-skin="cute"] .backbtn,
[data-skin="cute"] .tabbar button.on{color:var(--accent-ink);}
[data-skin="cute"] .btn.primary{border-radius:999px;box-shadow:0 10px 20px -12px rgba(216,90,130,.7);}
[data-skin="cute"] .chip,[data-skin="cute"] .iconbtn,[data-skin="cute"] .seg{border-radius:999px;}
[data-skin="cute"] .day{border-radius:13px;}
[data-skin="cute"] .setlist{border-radius:18px;}
[data-skin="cute"] .sheet{border-radius:26px 26px 0 0;}
[data-skin="cute"] .ta{font-size:calc(15.5px * var(--fs));line-height:1.95;}
[data-skin="cute"] .entry .content{line-height:1.95;letter-spacing:.2px;}
[data-skin="cute"] .page-sheet{
  background:radial-gradient(120% 30% at 50% 0%, #FFE6F1 0%, transparent 64%), var(--paper);
}
[data-skin="cute"] .trow{border-bottom-style:dashed;border-bottom-color:#F6DFE8;}
[data-skin="cute"] .trow .tn{color:var(--rust-ink);font-weight:600;}

/* ---- 霓 · 赛博科技：深空、双霓虹描边、网格 ---- */
[data-skin="tech"] .app{
  background:
    radial-gradient(120% 66% at 50% -18%, #0A1B2E 0%, transparent 58%),
    radial-gradient(90% 48% at 50% 106%, #0A1524 0%, transparent 60%),
    var(--paper);
}
[data-skin="tech"] .app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(63,227,232,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(63,227,232,.055) 1px, transparent 1px);
  background-size:24px 24px;
  -webkit-mask-image:radial-gradient(120% 88% at 50% 0%, #000 26%, transparent 76%);
  mask-image:radial-gradient(120% 88% at 50% 0%, #000 26%, transparent 76%);
}
[data-skin="tech"] .hd{border-bottom:1px solid rgba(63,227,232,.16);}
[data-skin="tech"] .hd h1{font-weight:500;letter-spacing:1.6px;font-size:19.5px;}
[data-skin="tech"] .hd-s{font-size:11.5px;letter-spacing:.6px;}
[data-skin="tech"] .q-cell{
  border-radius:10px;border:1px solid rgba(63,227,232,.26);
  background:linear-gradient(180deg, rgba(13,23,39,.96), rgba(8,13,23,.96));
  box-shadow:inset 0 0 22px -12px rgba(63,227,232,.55);
}
[data-skin="tech"] .q-cell .idx{color:var(--accent-ink);}
[data-skin="tech"] .grid9 .q-cell:nth-child(3n+3){
  border-color:rgba(176,124,255,.34);
  box-shadow:inset 0 0 22px -12px rgba(176,124,255,.62);
}
[data-skin="tech"] .q-cell:active{animation:neonflash .5s ease-out;}

/* ---- 鲸 · 鲸鱼女仆：海风底、泡泡、奶油卡，蓝发角色当贴纸 ---- */
[data-skin="whale"] .app{

[data-skin="whale"] .q-cell .idx{color:var(--accent-ink);opacity:.85;}
[data-skin="whale"] .q-cell:active{box-shadow:0 4px 10px -8px rgba(31,110,158,.9);}
[data-skin="whale"] .btn{

}
[data-skin="whale"] .btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-on);box-shadow:0 10px 22px -14px rgba(31,110,158,.95);}
[data-skin="whale"] .btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-2);box-shadow:none;}

[data-skin="whale"] .seg button{border-radius:999px;}
[data-skin="whale"] .seg button.on{background:#fff;color:var(--accent-ink);box-shadow:0 4px 10px -6px rgba(31,110,158,.7);}

[data-skin="whale"] .day.has{background:var(--accent-soft);color:var(--accent-ink);}

[data-skin="whale"] .tabbar{background:var(--bar);border-top:1px solid var(--line);backdrop-filter:blur(10px);}
[data-skin="whale"] .tabbar button.on{color:var(--accent-ink);}
[data-skin="whale"] .sheet{border-radius:26px 26px 0 0;border-top:1px solid var(--line);box-shadow:0 -18px 40px -30px rgba(31,110,158,.9);}
[data-skin="whale"] .page-sheet{
  background:radial-gradient(120% 26% at 50% 0%, #FFFFFF 0%, rgba(255,255,255,0) 70%), var(--paper);
}
[data-skin="whale"] .setlist,[data-skin="whale"] .tlist,[data-skin="whale"] .tipcard{border-radius:18px;}
[data-skin="whale"] .skin,[data-skin="whale"] .chip,[data-skin="whale"] .dbk{border-radius:999px;}
[data-skin="whale"] .ta{border-radius:20px;background:#fff;}
[data-skin="whale"] .entry .content{line-height:1.95;}
[data-skin="whale"] .setrow{border-bottom:1px solid var(--line-soft);}
[data-skin="whale"] .trow{border-bottom:1px solid var(--line-soft);}
[data-skin="whale"] .trow .tn{color:var(--accent-ink);}
[data-skin="whale"] .setsec{letter-spacing:1.2px;color:var(--accent-ink);}
[data-skin="whale"] .toast{border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 14px 30px -18px rgba(31,110,158,.9);}
[data-skin="whale"] .dbk.on{background:var(--accent);border-color:transparent;color:var(--accent-on);}

/* ---- 皮肤排印：只有「跟随系统」时才让各套皮肤的字体上场；
        用户明确选了黑体 / 宋体 / 楷体 / 等宽，就整屏统一，不再干预 ---- */
html[data-font="system"][data-skin="paper"] .hd h1,
html[data-font="system"][data-skin="paper"] .entry h2,
html[data-font="system"][data-skin="paper"] .setsec,
html[data-font="system"][data-skin="paper"] .rl-hd{font-family:var(--display)!important;}
html[data-font="system"][data-skin="cozy"] .hd h1,
html[data-font="system"][data-skin="cozy"] .entry h2{font-family:var(--display)!important;}
html[data-font="system"][data-skin="press"] .hd h1,
html[data-font="system"][data-skin="press"] .hd-s,
html[data-font="system"][data-skin="press"] .q-cell .idx,
html[data-font="system"][data-skin="press"] .btn,
html[data-font="system"][data-skin="press"] .tabbar button,
html[data-font="system"][data-skin="press"] .seg button,
html[data-font="system"][data-skin="press"] .entry h2,
html[data-font="system"][data-skin="press"] .setsec{font-family:var(--display)!important;}
html[data-font="system"][data-skin="tech"] .hd h1,
html[data-font="system"][data-skin="tech"] .hd-s,
html[data-font="system"][data-skin="tech"] .q-cell .idx,
html[data-font="system"][data-skin="tech"] .seg button,
html[data-font="system"][data-skin="tech"] .tabbar button,
html[data-font="system"][data-skin="tech"] .entry h2,
html[data-font="system"][data-skin="tech"] .setsec,
html[data-font="system"][data-skin="tech"] .trow .tn{font-family:var(--display)!important;}

@keyframes jelly{
  0%{transform:scale(1);}
  35%{transform:scale(1.055,.965);}
  62%{transform:scale(.985,1.02);}
  82%{transform:scale(1.012,.996);}
  100%{transform:scale(1);}
}
@keyframes neonflash{
  0%{box-shadow:inset 0 0 22px -12px rgba(63,227,232,.55);}
  30%{box-shadow:0 0 0 1px rgba(63,227,232,.85),0 0 26px -6px rgba(63,227,232,.6),inset 0 0 26px -8px rgba(63,227,232,.8);}
  100%{box-shadow:inset 0 0 22px -12px rgba(63,227,232,.55);}
}
@media (prefers-reduced-motion:reduce){
  [data-skin="cute"] .q-cell:active,[data-skin="tech"] .q-cell:active{animation:none;}
}

/* =========================================================
   v0.14.0 细节层：每套皮肤把「零件」也画成自己的样子
   —— 按钮 / 小胶囊 / 分段控件 / 翻页圆钮 / 滑杆 / 日期格 /
      Tab / Toast / 序号徽章 / 聚焦框，逐套重画，不共用一套默认外观
   ========================================================= */

/* ---- 1. 日系手账 paper：生宣、虚线、朱印、胶带 ---- */
[data-skin="paper"] .btn{border-radius:11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 1px 0 var(--line-2);}
[data-skin="paper"] .btn.primary{box-shadow:inset 0 0 0 1px rgba(255,255,255,.26),0 2px 7px -4px rgba(47,79,107,.6);}
[data-skin="paper"] .btn:active{transform:translateY(1px);box-shadow:none;}
[data-skin="paper"] .chip{border-style:dashed;background:var(--card);}
[data-skin="paper"] .seg{border-radius:11px;box-shadow:inset 0 1px 2px rgba(90,70,40,.09);}
[data-skin="paper"] .seg button{border-radius:8px;}
[data-skin="paper"] .seg button.on{position:relative;box-shadow:0 1px 0 var(--line),0 0 0 1px rgba(47,79,107,.1);}
[data-skin="paper"] .seg button.on::after{content:'';position:absolute;right:7px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--rust);}
[data-skin="paper"] .arrow{border-style:dashed;}
[data-skin="paper"] .arrow:active{background:var(--accent-soft);color:var(--accent-ink);}
[data-skin="paper"] .tabbar{border-top:1px dashed var(--line-2);}
[data-skin="paper"] .tabbar button.on{position:relative;}
[data-skin="paper"] .tabbar button.on::after{content:'';position:absolute;left:50%;bottom:1px;width:15px;height:2px;margin-left:-7.5px;border-radius:2px;background:var(--accent);}
[data-skin="paper"] .day.has{background:linear-gradient(180deg,#FBF6EA,#F5EDDE);box-shadow:inset 0 0 0 1px var(--line);}
[data-skin="paper"] .day.today{box-shadow:inset 0 0 0 1.5px var(--rust);}
[data-skin="paper"] .q-cell .idx{display:flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--rust);color:#FFF6EC;font-size:9.5px;font-weight:600;}
[data-skin="paper"] .rng::-webkit-slider-runnable-track{height:6px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 9px),var(--seg);}
[data-skin="paper"] .rng::-webkit-slider-thumb{width:14px;height:14px;margin-top:-4px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 2px var(--card),0 1px 3px rgba(47,79,107,.45);}
[data-skin="paper"] .toast{border-radius:9px;border:1px dashed var(--line-2);box-shadow:0 7px 18px -12px rgba(70,55,30,.7);}

/* ---- 2. 暗黑治愈 cozy：烛光、暖边、内发光 ---- */
[data-skin="cozy"] .btn{border-radius:999px;box-shadow:inset 0 0 0 1px rgba(232,185,120,.22);}
[data-skin="cozy"] .btn.primary{background:linear-gradient(180deg,#EFC283,#DDA455);color:var(--accent-on);box-shadow:inset 0 0 0 1px rgba(255,235,200,.35),0 0 20px -6px rgba(232,185,120,.55);}
[data-skin="cozy"] .btn:active{box-shadow:inset 0 0 18px -6px rgba(232,185,120,.5);}
[data-skin="cozy"] .chip{border-radius:999px;border-color:rgba(232,185,120,.3);background:rgba(232,185,120,.07);}
[data-skin="cozy"] .seg button.on{background:linear-gradient(180deg,#3A2C18,#2E2415);color:var(--rust-ink);box-shadow:inset 0 0 0 1px rgba(232,185,120,.35),0 0 14px -6px rgba(232,185,120,.5);}
[data-skin="cozy"] .arrow{border-color:rgba(232,185,120,.3);}
[data-skin="cozy"] .arrow:active{background:rgba(232,185,120,.14);color:var(--rust-ink);}
[data-skin="cozy"] .tabbar{box-shadow:0 -1px 0 var(--line),0 -14px 26px -22px rgba(232,185,120,.6);}
[data-skin="cozy"] .tabbar button.on svg{filter:drop-shadow(0 0 7px rgba(232,185,120,.65));}
[data-skin="cozy"] .day.has{background:linear-gradient(180deg,#33291A,#2A2113);color:var(--rust-ink);box-shadow:inset 0 0 0 1px rgba(232,185,120,.22);}
[data-skin="cozy"] .day.today{box-shadow:inset 0 0 0 1.5px var(--accent),0 0 14px -6px rgba(232,185,120,.7);}
[data-skin="cozy"] .rng::-webkit-slider-thumb{width:15px;height:15px;margin-top:-4.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(232,185,120,.16),0 0 14px -2px rgba(232,185,120,.85);}
[data-skin="cozy"] .toast{border:1px solid rgba(232,185,120,.45);background:#241C11;color:var(--ink);box-shadow:0 8px 24px -12px rgba(232,185,120,.5);}
[data-skin="cozy"] .ta{caret-color:var(--accent);}
[data-skin="cozy"] .q-cell .idx{color:rgba(232,185,120,.8);}

/* ---- 3. 极简专注 focus：一根线、方块、不喧哗 ---- */
[data-skin="focus"] .btn{border-radius:7px;box-shadow:none;}
[data-skin="focus"] .btn.primary{box-shadow:0 1px 2px rgba(15,18,22,.28);}
[data-skin="focus"] .btn.ghost{background:transparent;}
[data-skin="focus"] .chip{border-radius:7px;background:transparent;box-shadow:none;}
[data-skin="focus"] .seg{border-radius:8px;}
[data-skin="focus"] .seg button{border-radius:6px;}
[data-skin="focus"] .seg button.on{box-shadow:0 1px 2px rgba(15,18,22,.16);font-weight:500;}
[data-skin="focus"] .arrow{border-radius:8px;}
[data-skin="focus"] .arrow:active{background:var(--ink);color:var(--card);border-color:var(--ink);}
[data-skin="focus"] .tabbar{border-top:1px solid var(--line);}
[data-skin="focus"] .tabbar button.on{position:relative;}
[data-skin="focus"] .tabbar button.on::after{content:'';position:absolute;left:50%;bottom:0;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--ink);}
[data-skin="focus"] .day{background:transparent;}
[data-skin="focus"] .day.has{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(15,18,22,.22);font-weight:600;}
[data-skin="focus"] .day.today{box-shadow:inset 0 0 0 1.5px var(--ink);}
[data-skin="focus"] .q-cell .idx{font-variant-numeric:tabular-nums;letter-spacing:0;}
[data-skin="focus"] .rng::-webkit-slider-runnable-track{height:2px;background:var(--line-2);}
[data-skin="focus"] .rng::-webkit-slider-thumb{width:12px;height:12px;margin-top:-5px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--card);}
[data-skin="focus"] .toast{border-radius:7px;background:var(--ink);color:var(--paper);}

/* ---- 4. 复古打字机 press：铅字、方角、硬投影 ---- */
[data-skin="press"] .btn{border-radius:0;border-width:2px;border-color:var(--ink);background:var(--card);box-shadow:2px 2px 0 var(--ink);}
[data-skin="press"] .btn.primary{background:var(--accent);color:#F6F0DE;box-shadow:2px 2px 0 var(--ink);}
[data-skin="press"] .btn:active{transform:translate(2px,2px);box-shadow:none;}
[data-skin="press"] .chip{border-radius:0;border-width:1.5px;border-color:var(--ink-2);background:var(--card);letter-spacing:.6px;}
[data-skin="press"] .seg{border-radius:0;border:1.5px solid var(--ink-2);padding:2px;}
[data-skin="press"] .seg button{border-radius:0;}
[data-skin="press"] .seg button.on{background:var(--accent);color:#F6F0DE;box-shadow:none;}
[data-skin="press"] .arrow{border-radius:0;border:1.5px solid var(--ink-2);}
[data-skin="press"] .arrow:active{background:var(--ink);color:var(--card);}
[data-skin="press"] .tabbar{border-top:3px double var(--line-2);}
[data-skin="press"] .tabbar button.on{background:var(--ink);color:var(--card);border-radius:0;}
[data-skin="press"] .tabbar button.on span{font-weight:400;letter-spacing:.6px;}
[data-skin="press"] .day{border-radius:0;}
[data-skin="press"] .day.has{background:#EFE6CD;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-2);}
[data-skin="press"] .day.today{box-shadow:inset 0 0 0 2px var(--ink);}
[data-skin="press"] .q-cell .idx{letter-spacing:.8px;border-bottom:1px solid var(--line-2);}
[data-skin="press"] .rng::-webkit-slider-runnable-track{height:8px;border-radius:0;background:repeating-linear-gradient(90deg,var(--ink-2) 0 1px,transparent 1px 10px),var(--seg);border:1px solid var(--line-2);}
[data-skin="press"] .rng::-webkit-slider-thumb{width:9px;height:18px;margin-top:-6px;border-radius:0;background:var(--accent);box-shadow:1px 1px 0 rgba(38,34,26,.5);}
[data-skin="press"] .toast{border-radius:0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--card);color:var(--ink);letter-spacing:.4px;}

/* ---- 5. 超萌可爱 cute：棉花糖、糖果边、爱心点 ---- */
[data-skin="cute"] .btn{border-radius:999px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 6px 16px -10px rgba(226,97,140,.55);}
[data-skin="cute"] .btn.primary{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 7px 18px -9px rgba(226,97,140,.75);}
[data-skin="cute"] .btn:active{animation:jelly .32s ease-out;}
[data-skin="cute"] .chip{border-radius:999px;border-width:1.5px;}
[data-skin="cute"] .seg{border-radius:999px;background:#FDEBF2;}
[data-skin="cute"] .seg button{border-radius:999px;}
[data-skin="cute"] .seg button.on{position:relative;box-shadow:0 3px 8px -5px rgba(226,97,140,.8);}
[data-skin="cute"] .seg button.on::after{content:'';position:absolute;left:50%;bottom:3px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--accent);}

[data-skin="cute"] .arrow:active{animation:jelly .32s ease-out;background:#FDE6EF;}

[data-skin="cute"] .day{border-radius:12px;}
[data-skin="cute"] .day.has{background:#FDE6EF;color:var(--accent-ink);box-shadow:0 3px 8px -6px rgba(226,97,140,.9);}
[data-skin="cute"] .day.today{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 4px #FFF;}
[data-skin="cute"] .q-cell .idx{color:var(--accent-ink);}
[data-skin="cute"] .rng::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:#FDE6EF;}
[data-skin="cute"] .rng::-webkit-slider-thumb{width:17px;height:17px;margin-top:-4.5px;border-radius:50%;background:#FFF;border:3px solid var(--accent);box-shadow:0 2px 6px -2px rgba(226,97,140,.65);}
[data-skin="cute"] .toast{border-radius:999px;border:1.5px solid #F6CDDD;box-shadow:0 8px 20px -12px rgba(226,97,140,.8);}

/* ---- 6. 赛博科技 tech：切角、扫描线、霓虹 ---- */
[data-skin="tech"] .btn{
  border-radius:0;border-color:rgba(63,227,232,.55);
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));
  box-shadow:inset 0 0 0 1px rgba(63,227,232,.12);
}
[data-skin="tech"] .btn.primary{background:linear-gradient(180deg,#57E9ED,#35C9CE);color:#04121A;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);}
[data-skin="tech"] .btn.primary::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(4,18,26,.16) 0 1px,transparent 1px 3px);pointer-events:none;}
[data-skin="tech"] .btn.ghost{border-color:rgba(176,124,255,.5);color:var(--rust-ink);}
[data-skin="tech"] .chip{border-radius:0;border-color:rgba(63,227,232,.55);letter-spacing:.8px;text-transform:uppercase;font-size:11px;}
[data-skin="tech"] .seg{border-radius:0;border:1px solid rgba(63,227,232,.3);background:#081020;}
[data-skin="tech"] .seg button{border-radius:0;letter-spacing:.6px;}
[data-skin="tech"] .seg button.on{background:rgba(63,227,232,.16);color:var(--accent-ink);box-shadow:inset 0 0 0 1px rgba(63,227,232,.55),0 0 14px -6px rgba(63,227,232,.8);}
[data-skin="tech"] .arrow{border-radius:0;border-color:rgba(63,227,232,.5);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));}
[data-skin="tech"] .arrow:active{background:rgba(63,227,232,.18);}
[data-skin="tech"] .tabbar{border-top:1px solid rgba(63,227,232,.28);}
[data-skin="tech"] .tabbar button.on{position:relative;text-shadow:0 0 10px rgba(63,227,232,.6);}
[data-skin="tech"] .tabbar button.on::before{content:'';position:absolute;left:22%;right:22%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 10px rgba(63,227,232,.9);}

<script>
(function(){
'use strict';

/* =========================================================

   ========================================================= */
var KEY = 'writing-diary:v1';
var WD  = ['日','一','二','三','四','五','六'];
var WD_ORDER = [1,2,3,4,5,6,0];          // 周一起始
var BLANK_Q = function(){ return ['','','','','','','','','']; };
/* 字体：只换字族，字体全部来自手机本身（不引外部字体）。选了就作用于整个界面 */
var FONT_NAME = { system:'跟随系统', sans:'黑体', serif:'宋体', kai:'楷体', mono:'等宽', round:'圆体', thin:'细黑', bold:'粗黑' };

/* ---- 像素女仆：24×24 的小像，只用代码画，不引外部图片 ----
   底部三个 Tab 各一个变体（九宫格 / 铅笔 / 日历），只在「像素女仆」皮肤里出现。
   取色自角色立绘：藏青底、蓝发三段、围裙奶白、金边蝴蝶结。 */
var PX_PAL = {
  O:'#31557D', h:'#7FB6E8', m:'#A9D3F3', l:'#D6ECFB',
  f:'#FFE8DA', e:'#2B4C74', W:'#FFFFFF', k:'#FFB6C8',
  w:'#FFFFFF', d:'#7C9FCB', g:'#F7C978'
};
function pxMaidSVG(prop){
  var W = 24, H = 24, g = {};
  function set(x, y, c){
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    g[x + ',' + y] = c;
  }
  function mir(x, y, c){ set(x, y, c); set(W - 1 - x, y, c); }   // 左右对称
  function box(x0, x1, y0, y1, c){
    for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) mir(x, y, c);
  }
  function ell(cx, cy, rx, ry, c){
    for (var y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (var x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++){
        var dx = (x - cx) / rx, dy = (y - cy) / ry;
        if (dx * dx + dy * dy <= 1) set(x, y, c);
      }
  }
  /* 头发 → 头顶高光 → 脸 → 刘海 → 女仆发箍 */
  ell(11.5, 9.2, 8.4, 8.0, 'h');
  ell(11.5, 4.0, 6.6, 2.4, 'l');
  ell(11.5, 10.4, 5.5, 4.8, 'f');
  ell(11.5, 5.9, 6.1, 2.4, 'm');
  box(6, 11, 2, 2, 'w');
  box(5, 11, 3, 4, 'w');
  /* 眼睛 2×3：先画整块深色，再把左上角点成高光 */
  mir(8, 10, 'e'); mir(9, 10, 'e');
  mir(8, 11, 'e'); mir(9, 11, 'e');
  mir(8, 12, 'e'); mir(9, 12, 'e');
  mir(8, 10, 'W');
  mir(7, 13, 'k');
  set(11, 14, 'k'); set(12, 14, 'k');
  /* 脖子 → 肩膀 → 裙子 → 围裙 → 蝴蝶结 */
  box(9, 11, 15, 15, 'f');
  box(6, 11, 16, 16, 'd');
  box(7, 11, 17, 22, 'd');
  box(9, 11, 17, 21, 'w');
  set(11, 16, 'g'); set(12, 16, 'g');
  /* 描一圈深色边 */
  var edge = {};
  Object.keys(g).forEach(function(k){
    var p = k.split(','), x = +p[0], y = +p[1];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var nx = x + d[0], ny = y + d[1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) return;
      if (!g[nx + ',' + ny]) edge[nx + ',' + ny] = 'O';
    });
  });
  Object.keys(edge).forEach(function(k){ g[k] = 'O'; });
  /* 三个 Tab 的小道具（右下角留白里） */

    [[21,17],[20,18],[19,19],[18,20],[17,21]].forEach(function(p){ set(p[0], p[1], 'g'); });
  } else if (prop === 'cal'){
    for (var yy = 17; yy <= 21; yy++) for (var xx = 17; xx <= 22; xx++){
      var b = (yy === 17 || yy === 21 || xx === 17 || xx === 22);
      set(xx, yy, b ? 'g' : 'O');
    }
  } else {
    [[17,18],[21,18],[19,20],[17,22],[21,22]].forEach(function(p){ set(p[0], p[1], 'g'); });
  }
  /* 同一行同色像素合成一条 rect，输出体积小 */
  var out = '<svg viewBox="0 0 24 24" shape-rendering="crispEdges" aria-hidden="true">';
  for (var ry = 0; ry < H; ry++){
    var rx = 0;
    while (rx < W){
      var c = g[rx + ',' + ry];
      if (!c){ rx++; continue; }
      var sx = rx;
      while (rx < W && g[rx + ',' + ry] === c) rx++;
      out += '<rect x="'+sx+'" y="'+ry+'" width="'+(rx - sx)+'" height="1" fill="'+(PX_PAL[c] || c)+'"/>';
    }
  }
  return out + '</svg>';
}

var RANDOM_Q = (function(){
  var seen = {}, out = [];
  for(var i=0;i<RANDOM_Q_RAW.length;i++){
    var q = String(RANDOM_Q_RAW[i]||'').trim();
    if(!q) continue;
    /* 去重键：忽略空白与常见标点，避免「同一句、标点不同」被当成两条 */
    var k = q.replace(/[\s，。！？、；：「」『』（）()《》〈〉…—\-·,\.!?;:'"“”‘’~～]/g,'');
    if(!k || seen[k]) continue;
    seen[k] = 1;
    out.push(q);
  }
  return out;
})();

/* ---- 一本「本子」= 自己的 9 个问题 + 自己的日记（v0.10 起） ----
   存盘形状：{ v:2, books:[{id,name,createdAt,questions,entries}], activeId, settings }
   运行期把当前这一本摊平成 S.questions / S.entries，其余代码照旧读写这两个；
   写盘前 syncBook() 折回 books，切本后 bindActive() 再摊开。 */
var BOOKS_MIGRATED = false;   /* 老单本数据升级成多本后，启动时写盘一次 */
function newBookId(){
  return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function normQs(list){
  var q = BLANK_Q();
  if(Array.isArray(list)){
    for(var i=0;i<9;i++){ if(typeof list[i] === 'string') q[i] = list[i]; }
  }
  return q;
}
function makeBook(name, qs, entries, createdAt){
  var nm = (typeof name === 'string') ? name.replace(/\s+/g,' ').trim().slice(0,12) : '';
  return {
    id: newBookId(),
    name: nm || '未命名本',
    createdAt: (typeof createdAt === 'string' && createdAt) ? createdAt : new Date().toISOString(),
    questions: normQs(qs),
    entries: (entries && typeof entries === 'object') ? entries : {}
  };
}
/* v1 老数据没有本子创建时间：拿最早一篇的 createdAt 兜底 */
function firstEntryTime(entries){
  var first = '';
  Object.keys(entries || {}).forEach(function(k){
    var t = entries[k] && entries[k].createdAt;
    if(typeof t === 'string' && (!first || t < first)) first = t;
  });
  return first || new Date().toISOString();
}
function load(){
  var settings = { skin:'paper', fs:'m', font:'system', exportedAt:null, wallv:42 };
  var books = null, activeId = '';
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw) || {};
      var old = o.settings || {};
      var sk = old.skin;
      if(!SKIN[sk]) sk = (old.theme === 'dark') ? 'cozy' : 'paper';   /* v0.4 的明暗设置迁移过来 */
      settings = {
        skin: sk,
        fs: (old.fs === 's' || old.fs === 'l') ? old.fs : 'm',
        /* font: 'system' = 跟随系统字体（默认），其余是具体字族；整屏生效 */
        font: FONT_NAME[old.font] ? old.font : 'system',
        exportedAt: (typeof old.exportedAt === 'string') ? old.exportedAt : null,
        /* wallv: 0 = 最模糊/最淡，100 = 最清晰（旧版 wall 0/1/2 不再使用） */
        wallv: (typeof old.wallv === 'number')
          ? Math.min(100, Math.max(0, Math.round(old.wallv)))
          : 42
      };
      if(Array.isArray(o.books) && o.books.length){
        books = o.books.filter(function(b){ return b && typeof b === 'object'; }).map(function(b){
          return {
            id: (typeof b.id === 'string' && b.id) ? b.id : newBookId(),
            name: (typeof b.name === 'string' && b.name.trim()) ? b.name.trim().slice(0,12) : '未命名本',
            createdAt: (typeof b.createdAt === 'string' && b.createdAt) ? b.createdAt : new Date().toISOString(),
            questions: normQs(b.questions),
            entries: (b.entries && typeof b.entries === 'object') ? b.entries : {}
          };
        });
        activeId = (typeof o.activeId === 'string') ? o.activeId : '';
      }else if(o.entries || Array.isArray(o.questions)){
        /* v0.9 及以前的老数据：整包原样当成「第 1 本」，一条不动 */
        var oldEntries = (o.entries && typeof o.entries === 'object') ? o.entries : {};
        books = [ makeBook('第 1 本', o.questions, oldEntries, firstEntryTime(oldEntries)) ];
        BOOKS_MIGRATED = true;
      }
    }
  }catch(e){ /* 损坏数据则重置 */ }
  if(!books || !books.length) books = [ makeBook('第 1 本') ];

  var seen = {};
  books.forEach(function(b){ if(seen[b.id]) b.id = newBookId(); seen[b.id] = 1; });
  if(!books.some(function(b){ return b.id === activeId; })) activeId = books[0].id;
  return { v:2, books:books, activeId:activeId, settings:settings };
}

/* 安卓外壳：把原生安全区高度写进 --sat / --sab / --kb，网页版不调用。
   kb = 输入法高度（dp）。老版本外壳只传两个参数，这一项就不写，
   下面用 visualViewport 估算的逻辑会接手。 */
function applyKb(px){
  px = Math.max(0, Math.round(px || 0));
  document.documentElement.style.setProperty('--kb', px + 'px');
  /* 键盘弹起时收起底部 tab，把这一条的高度也让给正文（对应 CSS 里的 html.kb-on） */
  document.documentElement.classList.toggle('kb-on', px > 20);
  nudgeCaret();
}
window.setSafeArea = function(top, bottom, kb){
  var r = document.documentElement.style;
  if(typeof top === 'number') r.setProperty('--sat', Math.max(0, top) + 'px');
  if(typeof bottom === 'number') r.setProperty('--sab', Math.max(0, bottom) + 'px');
  if(typeof kb === 'number'){
    window.__kbNative = true;         // 原生给了准确值，估算就别再覆盖它
    applyKb(kb);
  }
};
/* 键盘弹起后 textarea 会被压矮，浏览器不一定会重新把光标滚进可视区，
   这里补一次：光标在末尾就滚到底，在中间就让浏览器重设一次选区（会带出光标）。 */
var nudgeTimer = null;
function nudgeCaret(){
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(function(){
    var ta = document.getElementById('ta');
    if(!ta || document.activeElement !== ta) return;
    if(ta.__composing) return;        // 中文输入法还在选词，别动
    if(ta.selectionEnd >= ta.value.length){ ta.scrollTop = ta.scrollHeight; }
    else{
      var p = ta.selectionEnd;
      try{ ta.setSelectionRange(p, p); }catch(e){}
    }
  }, 60);
}
/* 网页版 / 老外壳：用 visualViewport 估算键盘高度，补 --kb。
   浏览器已支持 interactive-widget=resizes-content 时，差值恒为 0，不会误判；
   新版安卓外壳会直接给 --kb（__kbNative），这时不插手。 */
(function(){
  if(!window.visualViewport) return;
  function sync(){
    if(window.__kbNative) return;
    var vv = window.visualViewport;
    var kb = Math.round(window.innerHeight - vv.height - vv.offsetTop);
    if(kb < 80) kb = 0;                // 地址栏收起之类的抖动不算键盘
    applyKb(kb);
  }
  window.visualViewport.addEventListener('resize', sync);
  window.visualViewport.addEventListener('scroll', sync);
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', function(){ setTimeout(sync, 240); });
  sync();
})();
function applyWall(){
  var on = !!WPS;
  document.documentElement.classList.toggle('wall', on);
  document.documentElement.style.setProperty('--wp', on ? 'url("'+WPS+'")' : 'none');
  /* wallv: 0 = 最模糊最淡，100 = 最清晰（几乎不罩、不虚化） */
  var v = Math.min(100, Math.max(0, S.settings.wallv));
  var veil = .96 - .86 * (v/100);
  if(DARK_SKIN[S.settings.skin]) veil = Math.min(.97, veil + .06);
  var blur = 7 - 6.4 * (v/100);
  document.documentElement.style.setProperty('--veil-a', veil.toFixed(3));
  document.documentElement.style.setProperty('--wp-blur', blur.toFixed(2)+'px');
  /* 卡片透明度：0% 时最实（.78），100% 时最透（.38） */
  var cardA = .78 - .40 * (v/100);
  document.documentElement.style.setProperty('--wall-card-a', cardA.toFixed(3));
}

/* 选图 → 等比缩到 1600px → JPEG 压到能塞进 localStorage */
function onWallpaperFile(ev){
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('请选择图片文件'); return; }
  if(f.size > 20*1024*1024){ toast('图片超过 20MB，换一张小一点的'); return; }
  toast('正在处理图片…');
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var MAX = 1600;
      var sc = Math.min(1, MAX / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * sc));
      var h = Math.max(1, Math.round(img.height * sc));
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var cx = cv.getContext('2d');
      cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, h);   /* 透明 PNG 垫白，避免变黑 */
      cx.drawImage(img, 0, 0, w, h);
      var data;
      try{ data = cv.toDataURL('image/jpeg', .82); }
      catch(e){ toast('图片处理失败，换一张试试'); return; }
      if(setWallpaper(data)){
        refreshSettings();
        toast('壁纸已更换');
      }
    };
    img.onerror = function(){ toast('图片读取失败，换一张试试'); };
    img.src = fr.result;
  };
  fr.onerror = function(){ toast('图片读取失败，换一张试试'); };
  fr.readAsDataURL(f);
}

function getEntry(k){
  var e = S.entries[k];
  if(!e || typeof e !== 'object') return null;
  if(!e.status) e.status = 'draft';
  return e;
}
function hasContent(k){
  var e = getEntry(k);
  return !!(e && wc(e.content));
}
/* 某一天在某个本子里的记录（空正文算没写） */
function bookEntryAt(b, k){
  var e = (b && b.entries) ? b.entries[k] : null;
  return (e && typeof e === 'object' && wc(e.content)) ? e : null;
}
/* 这一天写过字的全部本子，按创建时间排（顺序稳定，切换时不跳位） */
function dayBooks(k){
  var out = [];
  S.books.forEach(function(b){ if(bookEntryAt(b, k)) out.push(b); });
  out.sort(function(a, b){ return (a.createdAt || 0) - (b.createdAt || 0); });
  return out;
}

function viewEntry(k){

}

/* 跨天未提交草稿 → 自动锁定（T-01 选 A）；空草稿丢弃。所有本子都扫一遍 */
function sweepDrafts(){
  var t = todayKey(), changed = false;
  S.books.forEach(function(b){
    var es = b.entries || {};
    Object.keys(es).forEach(function(k){
      var e = es[k];
      if(!e || typeof e !== 'object'){ delete es[k]; changed = true; return; }
      if(e.status === 'draft' && k < t){
        if(!wc(e.content)){
          delete es[k];
        }else{
          e.status = 'locked';
          e.wordCount = wc(e.content);
          var d = parseKey(k);
          e.lockedAt = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59).toISOString();
        }
        changed = true;
      }
    });
  });
  if(changed) persist();
}

/* =========================================================
   1.5 我的本子：新建 / 切换 / 改名
   ========================================================= */
function bookStats(b){
  var days = 0, words = 0, first = '', last = '';
  Object.keys(b.entries || {}).forEach(function(k){
    var e = b.entries[k];
    if(!e || !wc(e.content)) return;
    days++; words += wc(e.content);
    if(!first || k < first) first = k;
    if(k > last) last = k;
  });
  return { days:days, words:words, first:first, last:last };
}
function bookMeta(b){
  var st = bookStats(b);
  if(!st.days) return '还没有日记';
  var start = (st.first === st.last) ? shortDate(st.first) : shortDate(st.first) + ' 起';
  return start + ' · ' + st.days + ' 天 · ' + st.words + ' 字';
}
function bookByName(name){
  for(var i=0;i<S.books.length;i++){ if(S.books[i].name === name) return S.books[i]; }
  return null;
}
function defaultBookName(){ return '第 ' + (S.books.length + 1) + ' 本'; }
/* 本子名用来和导入文件对号，别出现两个一模一样的 */
function uniqBookName(name, exceptId){
  var base = name, n = 1;
  function taken(x){
    return S.books.some(function(b){ return b.name === x && b.id !== exceptId; });
  }
  while(taken(base)){
    n++;
    var suf = ' ' + n;
    base = name.slice(0, 12 - suf.length) + suf;
  }
  return base;
}

function openDeleteBook(id){
  var b = bookById(id);
  if(!b) return;
  if(S.books.length <= 1){ toast('至少要留一本'); return; }
  var ks = Object.keys(b.entries || {});
  var locked = ks.filter(function(k){ return b.entries[k].status === 'locked'; }).length;
  var body;
  if(!ks.length){
    body = '这本还没写过日记，删掉不会影响别的本子。';
  }else{
    body = '这本里有 <b>'+ks.length+' 天</b> 日记'+(locked? '，其中 <b>'+locked+' 篇已锁定</b>' : '')+
      '。删掉之后这些文字就找不回来了，也不在备份里——除非你之前导出过 JSON。';
  }
  openSheet(
    '<div class="sheet-hd"><b>删除「'+esc(b.name)+'」？</b><button class="donebtn" data-act="books">取消</button></div>'+
    '<p class="sheet-p">'+body+'</p>'+
    '<div class="row-end" style="margin-top:14px">'+
      '<button class="btn ghost" data-act="books">取消</button>'+
      '<button class="btn danger-ghost" data-act="do-del-book" data-id="'+b.id+'">删除这一本</button>'+
    '</div>'
  );
}

function doDeleteBook(id){
  var b = bookById(id);
  if(!b) return;
  if(S.books.length <= 1){ toast('至少要留一本'); closeLayer(); return; }
  syncBook();
  var wasActive = (b.id === S.activeId);
  var idx = S.books.indexOf(b);
  if(idx < 0) return;
  S.books.splice(idx, 1);
  if(wasActive){
    /* 删的是当前这本：顺手挪到邻居那本，仍停在原来那一屏 */
    var nx = S.books[Math.min(idx, S.books.length - 1)];
    S.activeId = nx.id;
    bindActive();
  }
  if(viewBookId === id) viewBookId = null;
  persist();
  render();
  openBooks();
  toast('已删除「'+b.name+'」');
}

   3. 渲染：容器
   ========================================================= */
function render(){
  var v = $('#view');
  v.className = 'view' + (ui.tab === 'write' ? ' write-view' : '');

  if(ui.tab === 'questions')      v.innerHTML = viewQuestions();
  else if(ui.tab === 'write')     v.innerHTML = viewWrite();
  else                            v.innerHTML = viewReview();

  syncTabs();
  v.classList.remove('fade');
  void v.offsetWidth;
  v.classList.add('fade');
  afterRender();
}

function syncTabs(){
  Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'), function(b){
    b.classList.toggle('on', b.dataset.tab === ui.tab);
  });
}

function afterRender(){
  if(ui.tab === 'write'){
    var ta = $('#ta');
    if(ta){
      ta.value = (getEntry(todayKey()) || {}).content || '';
      var e = getEntry(todayKey());
      if(e && e.status === 'locked') ta.setAttribute('readonly','');
    }
  }
  var sc = $('.view');
  if(sc) sc.scrollTop = 0;
}

function viewWrite(){
  var k = todayKey();
  var e = getEntry(k);
  var locked = !!(e && e.status === 'locked');
  var content = e ? (e.content || '') : '';
  var fresh = !locked && !wc(content) && !Object.keys(S.entries).some(hasContent);

  var head =
    '<header class="hd">'+
      '<div class="hd-t">'+
        '<h1 class="date-t">'+esc(fmtCN(k))+'</h1>'+
        '<p class="hd-s">'+
          '<button class="booklink" data-act="books">'+esc(curBook().name)+'</button> · '+
          (locked
            ? '<span class="badge">已锁定</span>'+(e.lockedAt ? '提交于 '+hhmm(e.lockedAt) : '本篇为只读')
            : '提交前可随时修改')+
        '</p>'+
      '</div>'+
      '<div class="hd-btns">'+
        '<button class="chip" data-act="new-book">新建</button>'+
        '<button class="chip" data-act="open-questions">问题</button>'+
      '</div>'+
    '</header>';

  var body =
    '<div class="body editor">'+
      (locked ? '<div class="locked-note">这篇日记已提交锁定，永久只读；回顾里仍可查看。</div>' : '')+
      (fresh ? '<p class="firsthint" id="firsthint">还没写过。<button class="linkbtn" data-act="open-questions">先看一眼这 9 个问题</button>，也可以直接开始写。</p>' : '')+
      '<textarea id="ta" class="ta" placeholder="今天想写点什么…"'+(locked?' readonly':'')+'></textarea>'+
    '</div>';

  var foot =
    '<div class="wfoot">'+
      '<div class="wstats">'+
        '<span class="wcount" id="wcount">'+wc(content)+' 字</span>'+
        '<span class="autosave" id="autosave">'+
          (locked
            ? '已封存'
            : (e && e.updatedAt ? '已自动保存 '+hhmm(e.updatedAt) : ''))+
        '</span>'+
      '</div>'+
      '<div class="wbtns">'+
        (locked
          ? '<button class="btn ghost" data-act="go-review">去回顾看看</button>'
          : '<button class="btn ghost" data-act="save-draft">保存草稿</button>'+
            '<button class="btn primary" data-act="submit">提交锁定</button>')+
      '</div>'+
    '</div>';

  return head + body + foot;
}

/* =========================================================
   6. 视图 3：回顾
   ========================================================= */
function monthStat(y, m){
  var prefix = y + '-' + pad(m), days = 0, words = 0;
  Object.keys(S.entries).forEach(function(k){
    var e = S.entries[k];
    if(!e || k.slice(0,7) !== prefix) return;
    var w = wc(e.content);
    if(w > 0){ days++; words += w; }
  });
  return { days: days, words: words };
}
function yearStat(y){
  var prefix = String(y) + '-', days = 0, words = 0;
  Object.keys(S.entries).forEach(function(k){
    var e = S.entries[k];
    if(!e || k.slice(0,4) !== String(y)) return;
    var w = wc(e.content);
    if(w > 0){ days++; words += w; }
  });
  return { days: days, words: words };
}
function allYears(){
  var set = {};
  Object.keys(S.entries).forEach(function(k){
    if(hasContent(k)) set[k.slice(0,4)] = 1;
  });
  set[String(now().getFullYear())] = 1;
  return Object.keys(set).map(Number).sort(function(a,b){ return b-a; });
}

function viewReview(){
  var head =
    '<header class="hd">'+
      '<div class="hd-t"><h1>回顾</h1>'+
      '<p class="hd-s">按日 / 月 / 年回看写过什么</p></div>'+
      '<button class="iconbtn" data-act="settings" aria-label="设置">'+

        '<circle cx="12" cy="12" r="3.1"/>'+
